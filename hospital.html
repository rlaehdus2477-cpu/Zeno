else if(parts[1]==='bookings'&&parts[2]&&method==='PATCH'){item=d.bookings.find(b=>b.id===id);if(!item)throw Error('예약을 찾을 수 없습니다.');let ownerChange=data.side==='owner';if(ownerChange){if(item.ownerId!==ownerId)throw Error('접근 권한이 없습니다.');if(!(['suggested','pending','accepted'].includes(item.status)))throw Error('변경할 수 없는 상태입니다.');if(data.status==='confirmed'&&item.status!=='suggested')throw Error('확인할 시간 제안이 없습니다.');if(!['confirmed','cancelled'].includes(data.status))throw Error('허용되지 않는 변경입니다.');}
else{if(item.hospitalId!==state.activeHospital)throw Error('병원 정보가 일치하지 않습니다.');const allowed={pending:['accepted','suggested','rejected'],accepted:['confirmed','rejected','suggested'],suggested:['rejected','suggested'],confirmed:['in_progress','done'],in_progress:['done'],done:[]};if(!allowed[item.status]?.includes(data.status))throw Error('허용되지 않는 상태 변경입니다.');}Object.assign(item,{status:data.status,proposedAt:data.proposedAt||item.proposedAt,hospitalNote:data.hospitalNote??item.hospitalNote,updatedAt:now})}
else if(path==='/api/settings'&&method==='PATCH'){let h=state.activeHospital;d.settings[h]={...d.settings[h],...data,updatedAt:now};item=d.settings[h]}
else if(path==='/api/questions'&&method==='POST'){item={...data,id:uid(),ownerId,status:'pending',answer:'',createdAt:now,updatedAt:now};d.questions.unshift(item)}

else if(path==='/api/reviews'&&method==='POST'){let b=d.bookings.find(x=>x.id===data.bookingId&&x.ownerId===ownerId&&x.status==='done');if(!b)throw Error('완료된 진료 예약에만 후기를 남길 수 있습니다.');if(d.reviews.some(x=>x.bookingId===b.id))throw Error('이미 후기를 작성했습니다.');item={...data,id:uid(),ownerId,hospitalId:b.hospitalId,points:100,createdAt:now};d.reviews.unshift(item)}
else throw Error('지원되지 않는 요청입니다.');localSet(d);return item||{ok:true}}
async function api(method,path,data,admin=false){
 const token=admin?state.adminToken:(APP_MODE==='hospital'?state.hospitalToken:state.ownerToken);
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),15000);
 let r;
 try{
  r=await fetch(path,{method,credentials:'same-origin',cache:'no-store',signal:controller.signal,headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:method==='GET'?undefined:JSON.stringify(data||{})});
 }catch(err){
  throw Error(err&&err.name==='AbortError'?'서버 응답이 지연되고 있습니다. 다시 시도해 주세요.':'네트워크 연결을 확인한 뒤 다시 시도해 주세요.');
 }finally{clearTimeout(timeout)}
 const result=await r.json().catch(()=>({}));
 if(!r.ok){if(r.status===401&&APP_MODE==='owner'&&!['/api/auth/login','/api/auth/register'].includes(path)){state.ownerToken='';state.owner=null;localStorage.removeItem('zeno-owner-auth')}throw Error(result.error||'서버 요청 실패 ('+r.status+')')}
 return result;
}

let zenoRefreshTask=null,zenoRefreshFailures=0,zenoDeferredPaint=false;
function zenoRefreshStamp(){
 return JSON.stringify([state.ownerToken,state.hospitalToken,state.local,state.serverReady,state.settings,state.bookings,state.questions,state.reviews,state.owner,state.pets,state.records,state.favorites,state.hospitalBookings,state.hospitalQuestions,state.hChangeRequests,state.appError,state.profileLoaded]);
}
function zenoRefreshPaint(before,page){
 if(!zenoDeferredPaint&&zenoRefreshStamp()===before)return;
 const active=document.activeElement;
 if(active&&active.closest&&active.closest('#app')&&/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)){zenoDeferredPaint=true;return;}
 const y=window.scrollY;
 const root=document.getElementById('app');
 const previousMinHeight=root?root.style.minHeight:'';
 if(root&&y>0)root.style.minHeight=Math.max(root.offsetHeight,document.documentElement.clientHeight)+'px';
 render();
 zenoDeferredPaint=false;
 if(state.page===page)window.scrollTo({left:0,top:y,behavior:'instant'});
 if(root)requestAnimationFrame(()=>{root.style.minHeight=previousMinHeight});
}
document.addEventListener('focusout',()=>{if(zenoDeferredPaint)setTimeout(()=>zenoRefreshPaint('',state.page),0)});
async function refresh(force=false){
 if(zenoRefreshTask){
  if(force){await zenoRefreshTask;return refresh(false)}
  return zenoRefreshTask;
 }
 const task=(async()=>{
  const before=zenoRefreshStamp(),page=state.page;
  const token=APP_MODE==='hospital'?state.hospitalToken:state.ownerToken;
  try{
   if(APP_MODE==='hospital'){
    if(!state.hospitalToken){render();return}
    await loadHospital(false);
   }else{
    if(!state.ownerToken){render();return}
    const v=await api('GET','/api/bootstrap');
    if(state.ownerToken!==token)return;
    state.settings=v.settings||{};
    state.bookings=v.bookings||[];
    state.questions=v.questions||[];
    state.reviews=v.reviews||[];
    state.owner=v.owner||state.owner;
    ownerId=state.owner?.id||'';
    if(!state.profileSaving){
     state.pets=v.profile?.pets||[];
     state.records=v.profile?.records||[];
     state.favorites=v.profile?.favorites||[];
    }
    state.profileLoaded=true;
   }
   if((APP_MODE==='hospital'?state.hospitalToken:state.ownerToken)!==token)return;
   zenoRefreshFailures=0;
   state.appError='';
   zenoRefreshPaint(before,page);
  }catch(err){
   console.error('ZENO refresh:',err);
   zenoRefreshFailures++;
   const signedOut=(APP_MODE==='hospital'?state.hospitalToken:state.ownerToken)!==token;
   if(zenoRefreshFailures>=2||signedOut){
    state.appError=err.message;
    zenoRefreshPaint(before,page);
   }
  }
 })();
 zenoRefreshTask=task;
 try{return await task}finally{if(zenoRefreshTask===task)zenoRefreshTask=null}
}
async function loadHospital(draw=true){if(!state.hospitalToken)return;try{const x=await api('GET','/api/dashboard?hospitalId='+encodeURIComponent(state.activeHospital));const newBookings=x.bookings||[];
 if(state.hAlertReady&&state.hLastHospital===state.activeHospital){const fresh=newBookings.filter(b=>b.status==='pending'&&!state.hSeenIds.includes(b.id));if(fresh.length){state.hNewCount+=fresh.length;toast('새 예약 요청 '+fresh.length+'건이 도착했습니다.');}}
 state.hSeenIds=newBookings.map(b=>b.id);state.hAlertReady=true;state.hLastHospital=state.activeHospital;
 state.hospitalBookings=newBookings;state.hospitalQuestions=x.questions||[];state.hChangeRequests=x.changeRequests||[];state.hSpecialtyKeywords=x.specialtyKeywords||[];state.settings[state.activeHospital]=x.settings||state.settings[state.activeHospital];if(draw)render()}catch(err){if(err.message.includes('401')||err.message.includes('권한')||err.message.includes('인증')){state.hospitalToken='';sessionStorage.removeItem('zeno-h-token')}if(draw){toast(err.message);render()}else throw err}}
async function loadAdmin(draw=true){if(!state.adminToken)return;try{state.adminStats=await api('GET','/api/admin/stats',null,true);if(draw)render()}catch(err){toast(err.message);state.adminToken='';sessionStorage.removeItem('zeno-admin-token');if(draw)render()}}

function hsSlot(date,time){
 const m=String(date||'').match(/^([0-9]{4})-([0-9]{2})-([0-9]{2})/);
 if(!m)return '일정 미입력';
 const day=['일','월','화','수','목','금','토'][new Date(Date.UTC(+m[1],+m[2]-1,+m[3])).getUTCDay()];
 const t=String(time||'').match(/([0-9]{1,2}):([0-9]{2})/);
 if(!t)return (+m[2])+'월 '+(+m[3])+'일('+day+')';
 return (+m[2])+'월 '+(+m[3])+'일('+day+') '+(+t[1]<12?'오전':'오후')+' '+String(+t[1]%12||12).padStart(2,'0')+':'+t[2];
}
function hsTimestamp(t){
 if(!t)return '미입력';
 const d=new Date(t);if(!Number.isFinite(d.getTime()))return String(t);
 const p=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:true}).formatToParts(d);
 const get=x=>p.find(v=>v.type===x)?.value||'';
 return get('month')+'월 '+get('day')+'일('+get('weekday')+') '+get('dayPeriod')+' '+get('hour')+':'+get('minute');
}
function hsRisk(b){
 if(['high','normal','low'].includes(b.urgency))return {level:b.urgency,label:{high:'긴급',normal:'보통',low:'낮음'}[b.urgency],note:b.urgencyNote||''};
 const s=String(b.note||'');
 if(/호흡곤란|숨쉬기 힘들|숨을 못|소변을 전혀|경련|의식이 없|의식 없|쓰러짐|심한 출혈|중독/.test(s))return {level:'high',label:'긴급',note:'즉시 전화 확인 권장'};
 if(/구토|설사|혈변|혈뇨|통증|식욕 부진/.test(s))return {level:'normal',label:'보통',note:'당일 확인 권장'};
 return {level:'low',label:'낮음',note:'일정 확인'};
}
function hsSteps(b){

}
function hiCanConfirm(b){return ['pending','accepted'].includes(b.status)}
function hiSlotMs(b){if(!b.date||!b.time)return NaN;return new Date(b.date+'T'+b.time+':00+09:00').getTime()}
function hiPastSlot(b){const ms=hiSlotMs(b);return Number.isFinite(ms)&&ms<Date.now()}
function hiStatus(b){

function hiInboxGroups(rows){
 const buckets={emergency:[],progress:[],awaiting:[],urgent:[],today:[],soon:[],later:[],past:[],closed:[]},today=hiToday(); /* CHANGED */
 for(const b of rows){
  if(b.status==='in_progress'){buckets.progress.push(b);continue}
  if(b.status==='suggested'){buckets.awaiting.push(b);continue}
  if(['done','cancelled','rejected'].includes(b.status)){buckets.closed.push(b);continue}
  if(/숨쉬기 힘들|소변을 전혀|경련|의식이 없|호흡곤란|의식 없/.test(String(b.note||''))){buckets.emergency.push(b);continue}
  const date=String(b.date||''),urgent=hiShowRiskHint(b)&&(hsRisk(b).level==='high'||/구토|혈변|혈뇨/.test(String(b.note||'')));
  if(date&&date<today){buckets.past.push(b);continue}

 return [['emergency','응급 전화 확인 우선'],['progress','진행 중'],['awaiting','보호자 응답 대기'],['urgent','당일 확인 필요'],['today','오늘 예정'],['soon','곧 확인 필요'],['later','이후 예정'],['past','지난 예약'],['closed','종료']].map(([key,label])=>buckets[key].length?'<section class="hi-group"><h3>'+label+' <span>'+buckets[key].length+'</span></h3><div class="hi-row-group">'+buckets[key].map(hiInboxRow).join('')+'</div></section>':'').join('')||'<p class="hi-empty">해당 조건의 예약이 없습니다.</p>';
}

function bookingCard(b,hospital=false){if(hospital)return hsBookingCard(b);let h=hospitalById(b.hospitalId),step={pending:1,accepted:2,suggested:2,confirmed:3,in_progress:3,done:4,cancelled:1,rejected:1}[b.status]||1;return `<article class="booking-card"><div class="head"><div><h3>${hospital?e(b.petName):e(h?.name||'병원 정보 없음')}</h3><p>${hospital?e(b.petName)+' · '+e(b.species):e(b.petName)+' · '+e(b.species)} / ${e(b.service)}</p></div><span class="status ${b.status==='confirmed'?'available':b.status==='pending'?'busy':''}">${e(STATUS[b.status]||b.status)}</span></div><div class="booking-steps">${[1,2,3,4].map(n=>`<div class="${n<=step?'done':''}"></div>`).join('')}</div><p><strong>희망일:</strong> ${e(b.date)} ${e(b.time)} ${b.proposedAt?`<br><strong>병원 제안:</strong> ${e(b.proposedAt.replace('T',' '))}`:''}</p>${b.note?`<p>증상·요청: ${e(b.note)}</p>`:''}${b.hospitalNote?`<p style="background:#edf7ff;border-radius:8px;padding:9px"><strong>병원 메모:</strong> ${e(b.hospitalNote)}</p>`:''}<div class="buttons">${hospital?hospitalBookingButtons(b):ownerBookingButtons(b)}</div><p class="tiny">접수 ${dateTime(b.createdAt)} · 마지막 변경 ${dateTime(b.updatedAt)}</p></article>`}

const HI_SPECIALTY_KEYWORDS=["내과","심장·호흡기","정형외과","외과","치과·구강","안과","피부·귀","비뇨기","건강검진·접종","중성화수술","영상의학","종양 진료","신경 진료","고양이 진료","특수동물","재활 진료"];
function hiKeywordDateText(value){
 const date=String(value||'').slice(0,10);
 return /^\d{4}-\d{2}-\d{2}$/.test(date)?date.replace(/-/g,'.'):'확인일 미등록';
}
function hiKeywordDatePlusSix(value){
 const parts=String(value||'').slice(0,10).split('-').map(Number);
 if(parts.length!==3||!parts.every(Number.isInteger)||!parts[0])return '';
 const first=new Date(Date.UTC(parts[0],parts[1]-1+6,1));
 const lastDay=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();
 const end=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth(),Math.min(parts[2],lastDay)));
 return end.toISOString().slice(0,10);
}
function hiKeywordNeedsReview(rows){
 const today=new Date(Date.now()+9*60*60*1000).toISOString().slice(0,10);
 return rows.some(row=>{
  const last=row.lastCheckedAt||row.savedAt||row.registeredAt;
  const due=hiKeywordDatePlusSix(last);
  return Boolean(due&&today>=due);
 });
}

   render();
   zenoStartFailures++;
   const delay=Math.min(30000,5000*Math.pow(2,Math.min(zenoStartFailures-1,3)));
   if(!zenoStartRetry)zenoStartRetry=setTimeout(()=>{zenoStartRetry=null;start()},delay);
   return;
  }
  zenoStartFailures=0;
  state.appError='';
  if(APP_MODE==='owner'&&state.ownerToken){
   try{const x=await api('GET','/api/auth/me');state.owner=x.owner;ownerId=x.owner.id}
   catch(err){if(/인증|401|로그인/.test(err.message)){state.ownerToken='';state.owner=null;localStorage.removeItem('zeno-owner-auth')}}
  }
  await refresh();
  zenoStarted=true;
  if(!zenoPollTimer)zenoPollTimer=setInterval(zenoPoll,25000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)zenoPoll()});
  window.addEventListener('online',()=>{if(!state.serverReady){start()}else zenoPoll()});
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
 }finally{zenoStartPending=false}
}
render();start();

/* Shared version check for Galaxy Chrome and iPad Safari / installed PWA.
   Never reload while a booking sheet, modal or editable form is active. */
const ZENO_HOSPITAL_UI_REVISION='20261114-hospital-keyword-status-v17';
let zenoHospitalVersionBusy=false,zenoHospitalVersionLast=0;
async function zenoCheckHospitalUIRevision(force=false){
 if(zenoHospitalVersionBusy||document.hidden||state.modal||state.hDetailBookingId||document.activeElement?.closest('form'))return;
 const now=Date.now();
 if(!force&&now-zenoHospitalVersionLast<90000)return;
 zenoHospitalVersionLast=now;zenoHospitalVersionBusy=true;
 try{
  const response=await fetch('/api/ui-version?ts='+now,{cache:'no-store',credentials:'same-origin'});
  if(!response.ok)return;
  const data=await response.json();
  if(!data?.hospital||data.hospital===ZENO_HOSPITAL_UI_REVISION)return;
  if(document.hidden||state.modal||state.hDetailBookingId||document.activeElement?.closest('form'))return;
  window.location.replace('/hospital?ui='+encodeURIComponent(data.hospital));
 }catch(error){/* Keep current form state if temporarily offline. */}
 finally{zenoHospitalVersionBusy=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)zenoCheckHospitalUIRevision(true)});
window.addEventListener('pageshow',()=>zenoCheckHospitalUIRevision());
setInterval(()=>zenoCheckHospitalUIRevision(),180000);
</script></body></html>
