/* Search all recorded care labels, including composite department names.
   This only matches a registered field; it never infers care from a hospital name. */
function zenoCareLabelMatches(value,department){
 const label=String(value||'').replace(/\s+/g,'').toLowerCase();
 if(!label)return false;
 const aliases=zenoCareAliases(department).map(v=>String(v).replace(/\s+/g,'').toLowerCase());
 if(aliases.includes(label))return true;
 if(department==='건강검진·접종'&&label.endsWith('건강검진'))return true;
 const parts=label.split(/[·,/&+]|및/).filter(Boolean);
 return parts.some(part=>aliases.some(alias=>
  part===alias||part===alias+'진료'||part===alias+'센터'||part===alias+'클리닉'||part===alias+'치료'

/* Weekly clinic hours for owner-facing hospital details. All unknown entries stay unknown. */
function zenoWeeklyData(h){
 // An empty schedule is not a verified schedule. Preserve known legacy fallbacks.
 let week=h.weeklySchedule&&Object.keys(h.weeklySchedule).length?h.weeklySchedule:null;
 if(!week&&h.id==='pub006')week={'월':'10:00~20:00','화':'10:00~20:00','수':'10:00~20:00','목':'10:00~20:00','금':'10:00~20:00','토':'10:00~18:00','일':'휴진','공휴일':'10:00~18:00'};
 if(!week&&h.id==='pub027')week={'월':'09:00~18:00','화':'09:00~18:00','수':'09:00~18:00','목':'09:00~18:00','금':'09:00~18:00','토':'09:00~13:00'};
 if(!week&&['pub007','pub016'].includes(h.id))week=Object.fromEntries(['월','화','수','목','금','토','일','공휴일'].map(d=>[d,'24시간 진료 안내']));
 return week||{};
}
/* Recent reference timetables can inform a time-window label, never confirmed intake.
   Ark hospital retains its separately recorded reference-time handling below. */
function zenoProvisionalHoursRecent(h,date=new Date()){
 if(h.id==='pub034'||h.hoursVerificationStatus!=='ai-summary-unverified'||!h.provisionalSchedule||typeof h.provisionalSchedule!=='object')return false;
 const sourceDate=String(h.hoursSource||'').match(/20\d{2}-\d{2}-\d{2}/)?.[0];
 const checked=sourceDate||h.hoursCheckedAt||h.checkedAt||'';
 if(!/^\d{4}-\d{2}-\d{2}$/.test(checked))return false;
 const recorded=new Date(checked+'T00:00:00+09:00').getTime();
 return Number.isFinite(recorded)&&date.getTime()>=recorded&&date.getTime()-recorded<365*86400000;
}
function zenoStatusSchedule(h,date=new Date()){
 const verified=zenoWeeklyData(h);
 if(Object.keys(verified).length)return {week:verified,provisional:false};
 const provisional=zenoProvisionalHoursRecent(h,date);
 return {week:provisional?h.provisionalSchedule:verified,provisional};
}

// Reservation channels are independent of ZENO partnership and booking policy.
function zenoReservationGuide(h,allowZeno=false){
 const info=h.reservationInfo&&typeof h.reservationInfo==='object'?h.reservationInfo:{};
 const labels={phone:'전화 예약',naver:'네이버 예약',official:'홈페이지 예약',app:'병원 자체 앱',walkin:'예약 없이 방문'};
 const methods=[...new Set(Array.isArray(info.methods)?info.methods.filter(m=>Object.prototype.hasOwnProperty.call(labels,m)):[])];
 const channels=methods.map(m=>labels[m]);
 if(h.linked&&allowZeno)channels.unshift('ZENO 예약');
 const policies={required:'사전 예약 필수',recommended:'사전 예약 권장',optional:'예약 없이 방문 가능',walkin:'현장 접수 운영',partial:'일부 진료 예약제'};
 const policy=Object.prototype.hasOwnProperty.call(policies,info.policy)?policies[info.policy]:'예약제 여부 미확인';
 let url='';
 if(methods.some(m=>['naver','official','app'].includes(m))&&typeof h.reservationUrl==='string'){
  try{const u=new URL(h.reservationUrl);if(u.protocol==='https:')url=u.href;}catch{}
 }
 return {summary:channels.length?channels.join(' · '):'예약 방법 미확인',policy,url,note:typeof info.note==='string'?info.note:'',source:typeof info.source==='string'?info.source:'',checkedAt:typeof info.checkedAt==='string'?info.checkedAt:'',reportedAt:typeof info.reportedAt==='string'?info.reportedAt:'',reported:info.evidenceStatus==='reported',naverLinkStatus:info.naverLinkStatus||'',naverSearch:methods.includes('naver')&&!url?zenoNaverPhotoUrl(h):'',sourceUrl:typeof info.sourceUrl==='string'&&/^https:\/\//i.test(info.sourceUrl)?info.sourceUrl:'',hasExternal:methods.length>0};
}
function zenoNaverBookingUrl(h){
 const methods=Array.isArray(h.reservationInfo?.methods)?h.reservationInfo.methods:[];
 if(!methods.includes('naver'))return '';
 try{
  const u=new URL(h.reservationUrl||'');
  if(u.protocol!=='https:')return '';
  if(['m.place.naver.com','place.naver.com'].includes(u.hostname)&&/^\/(?:pet|hospital|place)\/\d+\/booking\/?$/.test(u.pathname))return u.href;
  if(u.hostname==='booking.naver.com'&&/^\/booking\/\d+\/bizes\/\d+/.test(u.pathname))return u.href;
  if(h.reservationInfo.naverLinkStatus==='official-booking-tab'&&u.hostname==='map.naver.com'&&/^\/p\/entry\/place\/\d+$/.test(u.pathname)&&/^\/booking(?:\?|$)/.test(u.searchParams.get('placePath')||''))return u.href;
 }catch{}
 return '';
}
function zenoNaverAction(h){
 if(!Array.isArray(h.reservationInfo?.methods)||!h.reservationInfo.methods.includes('naver'))return null;
 const direct=zenoNaverBookingUrl(h);

}
function zenoWebsiteBookingUrl(h){

}

function zenoReservationLine(h,allowZeno=false){
 const g=zenoReservationGuide(h,allowZeno);
 const unknown='예약 방법 미확인';
 const noPolicy='예약제 여부 미확인';
 let label=g.summary;
 if(label===unknown)label=g.policy===noPolicy?'예약 여부 문의':g.policy;
 else if(label==='예약 없이 방문'&&['예약 없이 방문 가능','현장 접수 운영'].includes(g.policy))label='예약 없이 방문 가능';
 else if(g.policy!==noPolicy)label+=' · '+g.policy;
 const methods=Array.isArray(h.reservationInfo?.methods)?h.reservationInfo.methods:[];
 const badges=[];
 const badge=(kind,copy)=>'<span class="zeno-channel-label zeno-channel-'+kind+'">'+e(copy)+'</span>';
 if(h.linked&&allowZeno)badges.push(badge('zeno','ZENO 예약'));
 if(methods.includes('naver'))badges.push(badge('naver',zenoNaverBookingUrl(h)?'네이버 예약':'네이버 예약 · 링크 확인 필요'));
 if(methods.includes('official'))badges.push(badge('website',zenoWebsiteBookingUrl(h)?'홈페이지 예약':'홈페이지 예약 · 링크 확인 필요'));
 if(methods.includes('phone'))badges.push(badge('phone','전화 예약'));
 else if(!methods.length&&h.reservationInfo?.policy==='recommended'&&/^0[0-9 -]{8,15}$/.test(String(h.phone||'').trim()))badges.push(badge('phone','전화 예약 문의'));
 if(zenoWalkInAllowed(h)||methods.includes('walkin'))badges.push(badge('walkin','예약 없이 방문'));
 if(methods.includes('app'))badges.push(badge('phone','병원 자체 앱'));
 if(!badges.length)return '<span class="directory-hours">예약 방법 · '+e(label)+(g.reported?' · 확인 필요':'')+'</span>';
 const policy=![noPolicy,'예약 없이 방문 가능','현장 접수 운영'].includes(g.policy)?g.policy:'';
 return '<span class="zeno-channel-labels">'+badges.join('')+'</span>'+((policy||g.reported)?'<span class="directory-hours">'+e([policy,g.reported?'확인 필요':''].filter(Boolean).join(' · '))+'</span>':'');
}

/* Korea-local schedule; information is NOT a live emergency acceptance signal. */
function zenoSeoulClock(date=new Date()){
 const d=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date);
 const p=Object.fromEntries(d.map(x=>[x.type,x.value]));
 return {weekday:{Mon:'월',Tue:'화',Wed:'수',Thu:'목',Fri:'금',Sat:'토',Sun:'일'}[p.weekday],now:Number(p.hour)*60+Number(p.minute)};
}
function zenoScheduleSpan(raw){
 const text=String(raw||'');
 if(!text||/휴진|미등록|미확인|별도 확인|휴무/.test(text))return null;
 if(/24시간/.test(text))return {start:0,end:1440,overnight:false};
 const m=text.match(/([01]?\d|2[0-3]):([0-5]\d)\s*(?:~|–|—|-)\s*([01]?\d|2[0-4]):([0-5]\d)/);
 if(!m)return null;
 const from=Number(m[1])*60+Number(m[2]),to=Number(m[3])*60+Number(m[4]);
 if(from>=1440||to>1440||from===to||(Number(m[3])===24&&Number(m[4])!==0))return null;
 return {start:from,end:to,overnight:to<from};
}
/* Interpret each clinic's specific rest days and intake cutoffs. Unknown days are never assumed. */
function zenoBreakAt(h,week,day,minutes){
 const slots=h.breakSchedule
   ?(h.breakSchedule[day]||[])
   :[week['점심시간']||''];
 return slots.some(raw=>{
  const span=zenoScheduleSpan(raw);
  return !!span&&minutes>=span.start&&(span.overnight||minutes<span.end);
 });
}
function zenoReceptionClosedAt(h,day,minutes){
 const cutoff=h.receptionDeadlines?.[day];
 const m=typeof cutoff==='string'&&cutoff.match(/^([01]?\d|2[0-3]):([0-5]\d)$/);
 return !!m&&minutes>=Number(m[1])*60+Number(m[2]);
}
/* UX overnight: yesterday's closing time determines availability, not a 20:00 opening cutoff. */
function zeno24HourEmergency(h){return Boolean(h.is24||h.emergency24);}
function zenoNightSchedule(h,date=new Date()){
 if(zeno24HourEmergency(h))return {listed:true,within:true,always:true};
 if(h.careSchedule&&!Object.keys(zenoWeeklyData(h)).length)return {listed:true,within:false,always:false};
 const clock=zenoSeoulClock(date),week=zenoWeeklyData(h),span=zenoScheduleSpan(week[clock.weekday]),minutes=clock.now;
 const days=['일','월','화','수','목','금','토'],i=days.indexOf(clock.weekday);
 const previous=zenoScheduleSpan(week[days[(i+6)%7]]);
 const fromYesterday=!!previous?.overnight&&minutes<previous.end;
 const withinToday=!!span&&minutes>=span.start&&(span.overnight||minutes<span.end);
 const within=(fromYesterday||withinToday)&&!zenoBreakAt(h,week,clock.weekday,minutes)&&!zenoReceptionClosedAt(h,clock.weekday,minutes);
 const nightOption=!!span&&(span.overnight||span.end>20*60);
 /* After overnight closing time in the early morning, exclude the closed hospital; do not show tonight's later session yet. */
 return {listed:fromYesterday||(minutes<6*60?false:minutes>=20*60?within:nightOption),within,always:false};
}
function zenoNightHours(h,date=new Date()){return zenoNightSchedule(h,date).listed;}
function zenoNightStatus(h,date=new Date()){
 if(h.careSchedule)return '야간 21:00~24:00 안내 · 운영 요일·접수 전화 확인';
 const state=zenoNightSchedule(h,date);
 if(h.is24)return '24시간 운영 안내';
 return state.within?'등록된 야간 진료시간 · 방문 전 전화 확인':'오늘 야간 시간표 안내 · 전화 확인';
}

function zenoPublishedClinicStatus(h,date=new Date()){
 const clock=zenoSeoulClock(date),schedule=zenoStatusSchedule(h,date),week=schedule.week;
 const qualifier='등록시간 기준';
 if(zenoArkWithinReferenceHours(h,date))return {text:'진료 중 · 등록시간 기준 (접수 전화 확인)',kind:'hours'};
 if(h.emergency24)return {text:'24시간 응급 안내 · 일반진료 별도',kind:'guide'};
 if(h.is24)return {text:'24시간 운영 안내',kind:'guide'};
 const days=['일','월','화','수','목','금','토'],day=clock.weekday;
 const todayHours=week[day],previous=zenoScheduleSpan(week[days[(days.indexOf(day)+6)%7]]);
 if(previous?.overnight&&clock.now<previous.end)return {text:'진료시간 내 · '+qualifier,kind:'hours'};
 if(!todayHours)return {text:'오늘 시간표 미확인',kind:'unknown'};
 if(/휴무|휴진/.test(todayHours))return {text:'오늘 휴진 · '+qualifier,kind:'closed'};
 const span=zenoScheduleSpan(todayHours);
 if(!span)return {text:'진료시간 확인 필요',kind:'unknown'};
 if(zenoBreakAt(h,week,day,clock.now))return {text:'휴게시간 · '+qualifier,kind:'closed'};
 if(clock.now>=span.start&&(span.overnight||clock.now<span.end)){
  if(zenoReceptionClosedAt(h,day,clock.now))return {text:'접수마감 · 진료시간 내',kind:'closed'};
  return {text:'진료 중 · '+qualifier+' (접수 전화 확인)',kind:'hours'};
 }
 return {text:'진료시간 외 · '+qualifier,kind:'closed'};
}

function zenoVisibleClinicHours(h,day=zenoTodayName()){

 const provisional=!Object.keys(week).length&&h.hoursVerificationStatus==='ai-summary-unverified'&&h.provisionalSchedule;
 const schedule=provisional?h.provisionalSchedule:week;

 const note=provisional?'등록된 시간표 · 실제 접수 전화 확인'
   :verified?'네이버 시간표 기준 · 실제 접수 전화 확인'

 if(today)return {text:day+'요일 '+today.replace('24시간 진료 안내','24시간 운영 안내'),note,hasTime:true,hasToday:true};
 const summary=String(h.hours||'').trim();
 // A published start time is not a verified opening interval or today's schedule.
 const onlyStart=summary.match(/([01]?\d|2[0-3]):([0-5]\d)\s*진료 시작/);
 if(onlyStart&&!/\d{1,2}:\d{2}\s*[~–—-]\s*\d{1,2}:\d{2}/.test(summary))
  return {text:onlyStart[1]+':'+onlyStart[2]+' 진료 시작',note:'종료시간·휴진일 확인 필요',hasTime:true,hasToday:false,partial:true};
 if(/\d{1,2}:\d{2}|24시간/.test(summary))
  return {text:summary,note,hasTime:true,hasToday:false};
 return {text:'진료시간 확인 필요',note:'등록된 요일별 시간표 없음 · 병원에 문의',hasTime:false,hasToday:false};
}

/* '내 주변': 사용자의 현재 위치는 브라우저 메모리에서만 사용하고 서버에 보내지 않습니다.
   병원 좌표는 네이버 Maps 주소 변환 API의 확인된 결과만 이용합니다. */
const ZENO_NEARBY_RADIUS_KM=5;
function zenoNearbyDistanceKm(h){
 const here=state.nearbyPosition,loc=state.nearbyCoordinates?.[h.id];
 if(!here||!loc)return Infinity;
 const a=Number(loc.lat),b=Number(loc.lon);
 if(!Number.isFinite(a)||!Number.isFinite(b))return Infinity;
 const rad=Math.PI/180,dLat=(a-here.lat)*rad,dLon=(b-here.lon)*rad;
 const k=Math.sin(dLat/2)**2+Math.cos(here.lat*rad)*Math.cos(a*rad)*Math.sin(dLon/2)**2;

}

  const response=await fetch('/api/public/hospital-coordinates'+(check?'?check=1':''),{cache:'no-store',credentials:'same-origin',signal:controller.signal});
  const body=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(body.error||'병원 위치 정보를 가져오지 못했습니다.');
  return body;
 }finally{clearTimeout(timeout)}

async function zenoReadNearbyPosition(){
 // Galaxy APK: native location avoids WebView permission inconsistencies.
 if(window.ZenoNearbyAndroid&&typeof window.ZenoNearbyAndroid.requestCurrentLocation==='function'){
  return await new Promise((resolve,reject)=>{
   const timeout=setTimeout(()=>{
    if(window.zenoNearbyAndroidLocationReport===report)window.zenoNearbyAndroidLocationReport=null;
    const error=Error('현재 위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.');
    error.code=3;
    reject(error);
   },22000);
   const report=raw=>{
    let data;
    try{data=typeof raw==='string'?JSON.parse(raw):raw}catch{return}
    if(!data||typeof data!=='object')return;
    clearTimeout(timeout);
    if(window.zenoNearbyAndroidLocationReport===report)window.zenoNearbyAndroidLocationReport=null;
    if(data.error){
     const error=Error(String(data.error));
     error.code=Number(data.code)||2;
     reject(error);
     return;
    }
    const lat=Number(data.lat),lon=Number(data.lon);
    if(!Number.isFinite(lat)||!Number.isFinite(lon)){
     const error=Error('현재 위치 좌표를 확인하지 못했습니다.');
     error.code=2;
     reject(error);
     return;
    }
    resolve({coords:{latitude:lat,longitude:lon,accuracy:Number(data.accuracy)||null}});
   };
   window.zenoNearbyAndroidLocationReport=report;
   try{window.ZenoNearbyAndroid.requestCurrentLocation()}
   catch(error){
    clearTimeout(timeout);
    if(window.zenoNearbyAndroidLocationReport===report)window.zenoNearbyAndroidLocationReport=null;
    reject(error);
   }
  });
 }
 return await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,maximumAge:120000,timeout:12000}));
}
async function zenoToggleNearby(){

/* Search-only card: verified facts, separate hospital input from inferred hours. */
function zenoSearchClinicStatus(h, scheduleOnly=false){
 // 병원이 직접 입력한 상태만 '병원 입력'으로 표시하고, 나머지는 등록된 시간표 기준 추정임을 같은 말투로 표시한다.
 const updated=!scheduleOnly&&h.linked?hs(h.id):null;
 if(updated?.updatedAt){
  const updatedMs=Date.parse(updated.updatedAt),fresh=Number.isFinite(updatedMs)&&Date.now()-updatedMs>=0&&Date.now()-updatedMs<30*60*1000;
  if(fresh)return {text:'병원 입력 · '+(updated.status==='available'?'접수 가능':updated.status==='busy'?'혼잡':'접수 상태 확인 필요'),kind:'direct'+(updated.status==='available'?' is-open':'')};
 }
 if(h.emergency24&&!h.is24)return {text:'24시간 응급 안내 · 수용 전화 확인',kind:'schedule24'};
 if(h.is24)return {text:'24시간 · 응급 별도 확인',kind:'schedule24'};
 const clock=zenoSeoulClock();
 if(h.careSchedule){
  const from=zenoScheduleSpan(h.careSchedule.day),to=zenoScheduleSpan(h.careSchedule.night);
  if(!from)return {text:'진료시간 확인 필요',kind:'unknown'};
  const end=to?to.end:from.end,within=clock.now>=from.start&&clock.now<end;
  return {text:(within?'진료시간 내':'진료시간 외')+' · 요일 미확인',kind:'estimated'+(within?' is-open':'')};
 }
 if(h.id==='pub034'&&zenoArkReferenceIsFresh(h)){
  const week=h.provisionalSchedule,day=clock.weekday,span=zenoScheduleSpan(week[day]);
  if(/휴무|휴진/.test(week[day]||''))return {text:'오늘 휴진 · 등록시간 기준',kind:'estimated'};
  if(!span)return {text:'진료시간 확인 필요',kind:'unknown'};
  if(zenoBreakAt(h,week,day,clock.now))return {text:'휴게시간 · 등록시간 기준',kind:'estimated'};
  const within=zenoArkWithinReferenceHours(h);
  return {text:(within?'진료시간 내':'진료시간 외')+' · 등록시간 기준',kind:'estimated'+(within?' is-open':'')};
 }
 const schedule=zenoStatusSchedule(h),week=schedule.week;
 const qualifier='시간표 기준';
 const days=['일','월','화','수','목','금','토'];
 const prior=zenoScheduleSpan(week[days[(days.indexOf(clock.weekday)+6)%7]]);
 const today=week[clock.weekday],span=zenoScheduleSpan(today);
 if(!today)return {text:'진료시간 확인 필요',kind:'unknown'};
 if(/휴진|휴무/.test(today))return {text:'오늘 휴진 · '+qualifier,kind:'estimated'};
 if(prior?.overnight&&clock.now<prior.end)return {text:'진료시간 내 · '+qualifier,kind:'estimated is-open'};
 if(!span)return {text:'진료시간 확인 필요',kind:'unknown'};
 if(zenoBreakAt(h,week,clock.weekday,clock.now))return {text:'휴게시간 · '+qualifier,kind:'estimated'};
 const within=clock.now>=span.start&&(span.overnight||clock.now<span.end);
 if(within&&zenoReceptionClosedAt(h,clock.weekday,clock.now))return {text:'접수마감 · 진료시간 내',kind:'estimated'};
 return {text:(within?'진료시간 내':'진료시간 외')+' · '+qualifier,kind:'estimated'+(within?' is-open':'')};
}

/* Home rail only: never equate historical or non-NAVER hours with currently open. */
function zenoHomeHoursVerified(h,date=new Date()){
 const source=String(h.hoursSource||''),evidence=source+' '+String(h.hours||'');
 // Accept recorded sources beyond Naver; reject missing or explicitly unverified provenance.
 if(!source.trim()||/미확인|미검증|확인 필요|자료 상충|시간 상충|출처 없음/.test(source))return false;
 if(/2025|미확인|미검증|확인 필요|자료 상충|시간 상충|현재 운영시간 아님/.test(evidence))return false;
 const checked=String(h.hoursCheckedAt||'');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(checked))return false;
 const verifiedAt=new Date(checked+'T00:00:00+09:00').getTime();
 return Number.isFinite(verifiedAt)&&date.getTime()>=verifiedAt&&date.getTime()-verifiedAt<365*86400000;
}
function zenoHomeWithinPublishedHours(h,date=new Date()){
 if(!zenoHomeHoursVerified(h,date)&&!zenoProvisionalHoursRecent(h,date))return false;

 const days=['일','월','화','수','목','금','토'],dayIndex=days.indexOf(clock.weekday);
 if(dayIndex<0)return false;
 const today=String(week[clock.weekday]||'');
 const nthClosed=/둘째\s*[·ㆍ,/]\s*넷째\s*주?\s*휴진/.test(today);
 if(nthClosed){
  const dayOfMonth=Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',day:'numeric'}).format(date));
  if([2,4].includes(Math.ceil(dayOfMonth/7)))return false;
 }
 const todayClean=nthClosed?today.replace(/\([^)]*둘째[^)]*휴진[^)]*\)/g,'').trim():today;
 const span=zenoScheduleSpan(todayClean);
 const prior=zenoScheduleSpan(week[days[(dayIndex+6)%7]]);
 const overnight=Boolean(prior?.overnight&&clock.now<prior.end);
 const within=Boolean(span&&clock.now>=span.start&&(span.overnight||clock.now<span.end));
 if(!overnight&&!within)return false;

 if(zenoReceptionClosedAt(h,clock.weekday,clock.now))return false;

}

function zenoHomeOpenLabel(h,date=new Date()){

async function zenoCompressPetPhoto(file){

 if(!/^image\/(?:jpeg|png|webp|heic|heif)$/.test(file.type)&&!(!file.type&&/\.(?:jpe?g|png|webp|heic|heif)$/i.test(file.name)))throw Error('JPG, PNG, WebP 또는 HEIC 사진을 선택해 주세요.');
 let source=null,objectUrl=null;
 try{
  if(typeof createImageBitmap==='function'){try{source=await createImageBitmap(file)}catch{}}
  if(!source){
   objectUrl=URL.createObjectURL(file);
   source=await new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(Error('이 사진을 읽을 수 없어요. JPG나 PNG로 다시 선택해 주세요.'));
    img.src=objectUrl;

  }
  const iw=source.width||source.naturalWidth,ih=source.height||source.naturalHeight;
  if(!iw||!ih)throw Error('사진 크기를 읽지 못했어요.');
  const side=Math.min(iw,ih);
  const sx=(iw-side)/2,sy=(ih-side)/2;
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
  if(!ctx)throw Error('이 기기에서 사진을 처리하지 못했어요.');
  for(const dimension of [320,256,192,144]){
   canvas.width=dimension;canvas.height=dimension;
   ctx.clearRect(0,0,dimension,dimension);
   ctx.drawImage(source,sx,sy,side,side,0,0,dimension,dimension);
   for(const type of ['image/webp','image/jpeg']){
    for(const quality of [.8,.64,.48]){
     const data=canvas.toDataURL(type,quality);
     if(zenoPetPhotoSource(data)&&data.startsWith('data:image/')&&data.length<=75000)return data;
    }
   }
  }
  throw Error('사진 크기를 줄일 수 없어요. 다른 사진으로 시도해 주세요.');
 }finally{
  if(source&&typeof source.close==='function')source.close();
  if(objectUrl)URL.revokeObjectURL(objectUrl);

}

function zenoPetsBookingSummary(){

}

function zenoPriceCategory(label){
 const s=String(label||'').replace(/\s+/g,'').toLowerCase();
 if(/초진|첫진료|초진료/.test(s))return '초진 진찰료';
 if(/재진|재진료/.test(s))return '재진 진찰료';
 if(/건강검진|종합검진|검진/.test(s))return '건강검진';
 if(/예방접종|종합백신|접종|백신/.test(s))return '예방접종';
 if(/엑스레이|x-ray|xray|방사선/.test(s))return '엑스레이';
 if(/초음파/.test(s))return '초음파';
 if(/혈액검사|혈액/.test(s))return '혈액검사';
 return String(label||'기타');
}

/* Adjust the booking sheet to the Android keyboard's visual viewport, without altering other dialogs. */
function zenoKeepBookingFieldVisible(dialog,input){
 const bounds=dialog.getBoundingClientRect(),field=input.getBoundingClientRect();
 const header=dialog.querySelector('.modal-head');
 const topLimit=Math.max(bounds.top+12,(header?.getBoundingClientRect().bottom||bounds.top)+10);
 const bottomLimit=bounds.bottom-18;
 if(field.top<topLimit)dialog.scrollTop-=topLimit-field.top;
 else if(field.bottom>bottomLimit)dialog.scrollTop+=field.bottom-bottomLimit;
}
function zenoSyncBookingViewport(){
 const backdrop=document.querySelector('.zeno-book-backdrop');
 if(!backdrop||window.innerWidth>750)return;
 const viewport=window.visualViewport;
 backdrop.style.setProperty('--zeno-book-viewport-height',Math.round(viewport?.height||window.innerHeight)+'px');
 backdrop.style.setProperty('--zeno-book-viewport-top',Math.round(viewport?.offsetTop||0)+'px');
 const dialog=backdrop.querySelector('.zeno-book-modal'),active=document.activeElement;
 const typing=!!(dialog&&active&&dialog.contains(active)&&active.matches('input:not([type="hidden"]):not([readonly]),textarea,select'));
 dialog.classList.toggle('zeno-book-typing',typing);
 if(typing)requestAnimationFrame(()=>{if(dialog.isConnected&&document.activeElement===active)zenoKeepBookingFieldVisible(dialog,active)});
}
window.addEventListener('resize',zenoSyncBookingViewport);
window.visualViewport?.addEventListener('resize',zenoSyncBookingViewport);

document.addEventListener('focusin',event=>{if(event.target.closest('.zeno-book-modal'))zenoSyncBookingViewport()});

async function start(){

  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),8000);

  if(!ready){
   state.appError='서버 연결을 재시도 중입니다.';
   render();
   zenoStartFailures++;
   const delay=Math.min(30000,5000*Math.pow(2,Math.min(zenoStartFailures-1,3)));
   if(!zenoStartRetry)zenoStartRetry=setTimeout(()=>{zenoStartRetry=null;start()},delay);
   return;
  }
  zenoStartFailures=0;
  state.appError='';
  if(APP_MODE==='owner'&&state.ownerToken){
   try{const x=await api('GET','/api/auth/me');state.owner=x.owner;ownerId=x.owner.id}
   catch(err){if(/인증|401|로그인/.test(err.message)){state.ownerToken='';state.owner=null;localStorage.removeItem('zeno-owner-auth');zenoApplyGuestProfile()}}
