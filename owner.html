async function api(method,path,data,admin=false){
 const token=admin?state.adminToken:(APP_MODE==='hospital'?state.hospitalToken:state.ownerToken);
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),15000);
 let r;
 try{
  r=await fetch(path,{method,credentials:'same-origin',cache:'no-store',signal:controller.signal,headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:method==='GET'?undefined:JSON.stringify(data||{})});
 }catch(err){
  throw Error(err&&err.name==='AbortError'?'서버 응답이 지연되고 있습니다. 다시 시도해 주세요.':'네트워크 연결을 확인한 뒤 다시 시도해 주세요.');
 }finally{clearTimeout(timeout)}
 const result=await r.json().catch(()=>({}));
 if(!r.ok){if(r.status===401&&APP_MODE==='owner'&&!['/api/auth/login','/api/auth/register'].includes(path)){state.ownerToken='';state.owner=null;localStorage.removeItem('zeno-owner-auth')}throw Error(result.error||'서버 요청 실패 ('+r.status+')')}
 return result;
}

function zenoRefreshPaint(before,page){

 const active=document.activeElement;
 if(active&&active.closest&&active.closest('#app')&&/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)){zenoDeferredPaint=true;return;}
 const y=window.scrollY;
 const root=document.getElementById('app');
 const previousMinHeight=root?root.style.minHeight:'';
 if(root&&y>0)root.style.minHeight=Math.max(root.offsetHeight,document.documentElement.clientHeight)+'px';
 render();
 zenoDeferredPaint=false;
 if(state.page===page)window.scrollTo({left:0,top:y,behavior:'instant'});
 if(root)requestAnimationFrame(()=>{root.style.minHeight=previousMinHeight});
}

 try{

  if(!response.ok)return;
  const body=await response.json();
  if(body&&body.settings&&typeof body.settings==='object')state.settings={...state.settings,...body.settings};
 }catch(error){/* Public browsing remains available during network errors. */}
}

async function refresh(force=false){
 if(zenoRefreshTask){
  if(force){await zenoRefreshTask;return refresh(false)}
  return zenoRefreshTask;
 }
 const task=(async()=>{
  const before=zenoRefreshStamp(),page=state.page;
  const token=APP_MODE==='hospital'?state.hospitalToken:state.ownerToken;
  try{
   if(APP_MODE==='hospital'){
    if(!state.hospitalToken){render();return}
    await loadHospital(false);
   }else{
    if(!state.ownerToken){await zenoLoadPublicHospitalSettings();zenoRefreshPaint(before,page);return}
    const v=await api('GET','/api/bootstrap');
    if(state.ownerToken!==token)return;
    state.settings=v.settings||{};
    state.bookings=v.bookings||[];
    state.questions=v.questions||[];
    state.reviews=v.reviews||[];
    // Pet photo profiles are stored separately from text health records.
    state.petPhotos=v.petPhotos||{};
    state.owner=v.owner||state.owner;
    ownerId=state.owner?.id||'';
    if(!state.profileSaving){
     state.pets=v.profile?.pets||[];
     state.records=v.profile?.records||[];
     state.favorites=v.profile?.favorites||[];
    }
    state.profileLoaded=true;
   }
   if((APP_MODE==='hospital'?state.hospitalToken:state.ownerToken)!==token)return;
   zenoRefreshFailures=0;
   state.appError='';
   zenoRefreshPaint(before,page);
  }catch(err){
   console.error('ZENO refresh:',err);
   zenoRefreshFailures++;
   const signedOut=(APP_MODE==='hospital'?state.hospitalToken:state.ownerToken)!==token;
   if(zenoRefreshFailures>=2||signedOut){
    state.appError=err.message;
    zenoRefreshPaint(before,page);
   }
  }
 })();
 zenoRefreshTask=task;
 try{return await task}finally{if(zenoRefreshTask===task)zenoRefreshTask=null}
}

/* Korea-local schedule; information is NOT a live emergency acceptance signal. */
function zenoSeoulClock(date=new Date()){
 const d=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date);
 const p=Object.fromEntries(d.map(x=>[x.type,x.value]));
 return {weekday:{Mon:'월',Tue:'화',Wed:'수',Thu:'목',Fri:'금',Sat:'토',Sun:'일'}[p.weekday],now:Number(p.hour)*60+Number(p.minute)};
}
function zenoScheduleSpan(raw){
 const text=String(raw||'');
 if(!text||/휴진|미등록|미확인|별도 확인|휴무/.test(text))return null;
 if(/24시간/.test(text))return {start:0,end:1440,overnight:false};
 const m=text.match(/([01]?\d|2[0-3]):([0-5]\d)\s*(?:~|–|—|-)\s*([01]?\d|2[0-4]):([0-5]\d)/);
 if(!m)return null;
 const from=Number(m[1])*60+Number(m[2]),to=Number(m[3])*60+Number(m[4]);
 if(from>=1440||to>1440||from===to||(Number(m[3])===24&&Number(m[4])!==0))return null;
 return {start:from,end:to,overnight:to<from};
}
/* UX overnight: yesterday's closing time determines availability, not a 20:00 opening cutoff. */
function zeno24HourEmergency(h){return Boolean(h.is24||h.emergency24);}
function zenoNightSchedule(h,date=new Date()){
 if(zeno24HourEmergency(h))return {listed:true,within:true,always:true};
 const clock=zenoSeoulClock(date),week=zenoWeeklyData(h),span=zenoScheduleSpan(week[clock.weekday]),minutes=clock.now;
 const days=['일','월','화','수','목','금','토'],i=days.indexOf(clock.weekday);
 const previous=zenoScheduleSpan(week[days[(i+6)%7]]);
 const fromYesterday=!!previous?.overnight&&minutes<previous.end;
 const withinToday=!!span&&minutes>=span.start&&(span.overnight||minutes<span.end);
 const within=fromYesterday||withinToday;
 const nightOption=!!span&&(span.overnight||span.end>20*60);
 /* After overnight closing time in the early morning, exclude the closed hospital; do not show tonight's later session yet. */
 return {listed:fromYesterday||(minutes<6*60?false:minutes>=20*60?within:nightOption),within,always:false};
}
function zenoNightHours(h,date=new Date()){return zenoNightSchedule(h,date).listed;}
function zenoNightStatus(h,date=new Date()){
 const state=zenoNightSchedule(h,date);
 if(h.is24)return '24시간 운영 안내';
 return state.within?'공개 시간표상 현재 시간대 · 방문 전 전화 확인':'오늘 야간 시간표 안내 · 전화 확인';
}

function zenoPublishedClinicStatus(h,date=new Date()){
 const clock=zenoSeoulClock(date),week=zenoWeeklyData(h);
 if(h.emergency24)return {text:'24시간 응급 안내 · 일반진료 별도',kind:'guide'};
 if(h.is24)return {text:'24시간 운영 안내',kind:'guide'};
 const days=['일','월','화','수','목','금','토'],day=clock.weekday;
 const todayHours=week[day],previous=zenoScheduleSpan(week[days[(days.indexOf(day)+6)%7]]);
 if(previous?.overnight&&clock.now<previous.end)return {text:'시간표상 야간 진료시간',kind:'hours'};
 if(!todayHours)return {text:'오늘 시간표 미확인',kind:'unknown'};
 if(/휴무|휴진/.test(todayHours))return {text:'시간표상 오늘 휴진',kind:'closed'};
 const span=zenoScheduleSpan(todayHours);
 if(!span)return {text:'진료시간 확인 필요',kind:'unknown'};
 const rest=zenoScheduleSpan(week['점심시간']||'');
 if(rest&&clock.now>=rest.start&&clock.now<rest.end)return {text:'시간표상 휴게시간',kind:'closed'};
 if(clock.now>=span.start&&(span.overnight||clock.now<span.end))return {text:'시간표상 진료시간',kind:'hours'};
 return {text:'시간표상 진료시간 외',kind:'closed'};
}

function zenoCatWaitingLabel(h){
 const c=h.catWaiting;if(!c)return '';
 if(c.verified)return '고양이 전용 대기실 · 병원 공식 안내';
 if(c.separate&&(c.guardianConfirmed||c.visited))return '별도 고양이 전용 대기실 · 보호자 방문 확인';
 if(c.guardianConfirmed||c.visited||c.source==='보호자 직접 방문')return '고양이 전용 대기실 · 보호자 방문 확인';
 return c.reported?'고양이 대기실 · 보호자 제보':'';
}
const CAT_WAITING_TERM=/고양이\s*(?:전용\s*)?대기실/;
function zenoWaitingQuery(query){
 const facility=CAT_WAITING_TERM;
 return {waiting:facility.test(query),text:query.replace(facility,' ').trim().replace(/\s+/g,'').toLowerCase()};
}
function applyHospitalQuery(value){
 const waiting=CAT_WAITING_TERM.test(value);
 state.query=value.replace(CAT_WAITING_TERM,' ').trim().replace(/\s+/g,' ');
 if(waiting&&!zenoHasFilter('고양이 대기실'))state.activeFilters=[...zenoActiveFilters(),'고양이 대기실'];
}
function zenoActiveFilters(){return [...new Set([...(state.activeFilters||[]),...(state.filter!=='전체'?[state.filter]:[])].map(x=>x==='고양이 친화 인증'||x==='고양이 친화 정보'?'고양이 친화':x))];}
function zenoHasFilter(v){return zenoActiveFilters().includes(v);}

function zenoListMatchedConditions(h){
 const result=[],fs=zenoActiveFilters();
 // Today hours already show the 24h/night status: never repeat the same time fact as a chip.
 if(state.specialty){
  const origin=zenoSpecialtyOrigin(h);
  if(origin==='official')result.push('병원 공식 안내 진료과');
  if(origin==='demo')result.push('병원 입력 · 진료 여부 확인 필요');
  if(origin==='public')result.push('공개정보 등록 과목 · 공식 확인 필요');
  if(origin==='report')result.push('보호자 제공 정보 · 진료 여부 전화 확인');
  if(origin==='name')result.push('병원명 일치 · 진료 여부 확인 필요');
  if(origin==='inquiry')result.push(state.specialty==='내과'?'내과 진료 여부 전화 확인':'진료 분야 미확인 · 전화 문의');
 }
 if(h.emergency24)result.unshift('24시간 응급 · 일반 진료 별도');
 else if(h.is24)result.unshift('24시간 진료 안내');
 else if(state.page==='emergency'||fs.includes('야간'))result.unshift('야간 진료 · 24시간 아님');
 const waitingLabel=zenoCatWaitingLabel(h);
 if(waitingLabel)result.push(waitingLabel);
 if(fs.includes('연결 병원')&&h.linked)result.push('예약 요청 가능');
 if(fs.includes('즐겨찾기'))result.push('저장한 병원');
 return [...new Set(result)];
}

/* Search-only card: verified facts, separate hospital input from inferred hours. */
function zenoSearchClinicStatus(h){
 const updated=h.linked?hs(h.id):null;
 if(updated?.updatedAt){
  return {text:'병원 갱신 · '+(updated.status==='available'?'수용 가능':updated.status==='busy'?'혼잡':'확인 필요'),kind:'direct'};
 }
 if(h.emergency24&&!h.is24)return {text:'24시간 응급진료 안내 · 수용 여부 전화 확인',kind:'schedule24'};
 if(h.is24)return {text:'24시간 운영',kind:'schedule24'};
 const clock=zenoSeoulClock(),week=zenoWeeklyData(h);
 const days=['일','월','화','수','목','금','토'];
 const prior=zenoScheduleSpan(week[days[(days.indexOf(clock.weekday)+6)%7]]);
 const today=week[clock.weekday],span=zenoScheduleSpan(today);
 const rest=zenoScheduleSpan(week['점심시간']||'');
 if(!today)return {text:'운영시간 확인 필요',kind:'unknown'};
 if(/휴진|휴무/.test(today))return {text:'진료 종료 · 운영시간 기준',kind:'estimated'};
 if(prior?.overnight&&clock.now<prior.end)return {text:'진료 중 · 운영시간 기준',kind:'estimated'};
 if(!span)return {text:'운영시간 확인 필요',kind:'unknown'};
 const isRest=rest&&!rest.overnight&&clock.now>=rest.start&&clock.now<rest.end;
 const open=!isRest&&clock.now>=span.start&&(span.overnight||clock.now<span.end);
 return {text:(open?'진료 중':'진료 종료')+' · 운영시간 기준',kind:'estimated'};
}

  return [['official','병원 공식 안내 진료과'],['public','외부 공개 안내 · 진료 여부 전화 확인'],['report','보호자 제공 정보 · 전화 확인 필요'],['demo','병원 입력 · 진료 여부 확인 필요'],['name','병원명 일치 · 진료 여부 전화 확인'],['inquiry','진료 여부 미확인 · 전화 문의']].map(([kind,label])=>{

/* UX search: only an explicit officialSpecialties entry warrants the 'official' label.
 Public catalogue categories, hospital demo entries, and hospital-name matches are separate. */
function zenoSpecialtyOrigin(h){
 const s=state.specialty;if(!s)return '';
 if(s==='특수동물')return (h.officialExoticSpecies||[]).length?'official':(hs(h.id).services||[]).some(x=>['토끼','햄스터','기니피그','조류','파충류'].includes(x))?'demo':'';
 const aliases=zenoCareAliases(s);
 if((h.officialSpecialties||[]).some(x=>aliases.includes(x)))return 'official';
 const services=hs(h.id).services||[];
 if(services.some(x=>aliases.includes(x)))return 'demo';
 if((h.cats||[]).some(x=>aliases.includes(x)))return 'public';
 if((h.reportedSpecialties||[]).some(x=>aliases.includes(x)))return 'report';
 if(s==='내과'&&(h.cats||[]).includes('일반'))return 'inquiry';
 /* CHANGED: name matching does not confirm a department. */
 return ''; /* CHANGED: no unverified general search results. */
}
function zenoSpecialtyNameOnly(h){return zenoSpecialtyOrigin(h)==='name';}
function filteredHospitals(){
 const query=zenoWaitingQuery(state.query);
 let list=HOSPITALS.filter(h=>!query.text||[h.name,...(h.aliases||[]),h.address,...(h.tags||[]),...(h.cats||[]),...(h.officialSpecialties||[]),...(h.reportedSpecialties||[]),...Object.keys(h.specialtySnippets||{})].join(' ').toLowerCase().replace(/\s+/g,'').includes(query.text));
 if(state.searchRegion)list=list.filter(h=>String(h.region||'').includes(state.searchRegion)||String(h.address||'').includes(state.searchRegion));
 const fs=zenoActiveFilters();
 if(fs.includes('24시'))list=list.filter(h=>Boolean(h.is24));
 if(fs.includes('야간'))list=list.filter(h=>!zeno24HourEmergency(h)&&zenoNightHours(h));
 if(fs.includes('고양이 대기실')||query.waiting){
  const confirmed=h=>Boolean(h.catWaiting.verified||h.catWaiting.guardianConfirmed||h.catWaiting.visited);
  list=list.filter(h=>zenoCatWaitingLabel(h)).sort((a,b)=>Number(confirmed(b))-Number(confirmed(a)));
 }
 const catFriendly=fs.includes('고양이 친화'),dogStress=fs.includes('강아지 피어프리·스트레스 케어');
 if(catFriendly||dogStress)list=list.filter(h=>(catFriendly&&Boolean(zenoCfc(h)))||(dogStress&&Boolean(zenoFearFree(h))));
 if(fs.includes('연결 병원'))list=list.filter(h=>h.linked);
 if(fs.includes('즐겨찾기'))list=list.filter(h=>state.favorites.includes(h.id));
 if(state.specialty)list=list.filter(h=>state.specialty==='특수동물'?(state.exoticSpecies?zenoExoticMatches(h,state.exoticSpecies):Boolean((h.officialExoticSpecies||[]).length||(hs(h.id).services||[]).some(x=>['토끼','햄스터','기니피그','조류','파충류'].includes(x)))):Boolean(zenoSpecialtyOrigin(h)));
 if(state.specialty){const rank={official:0,public:1,report:2,demo:3,name:4,inquiry:5};list.sort((a,b)=>(rank[zenoSpecialtyOrigin(a)]??4)-(rank[zenoSpecialtyOrigin(b)]??4));}
 if(catFriendly||dogStress)list.sort((a,b)=>{
  const aBoth=Number(Boolean(zenoCfc(a))&&Boolean(zenoFearFree(a))),bBoth=Number(Boolean(zenoCfc(b))&&Boolean(zenoFearFree(b)));
  if(catFriendly&&dogStress&&aBoth!==bBoth)return bBoth-aBoth;
  return Number(zenoCfc(b)?.status==='listed')-Number(zenoCfc(a)?.status==='listed');
 });
 return list;
}

function zenoVisitAt(b){
 return b.proposedAt&&['accepted','confirmed','in_progress','done','suggested'].includes(b.status)?String(b.proposedAt).replace('T',' '):String(b.date||'')+' '+String(b.time||'');

function zenoHomeBookingPreview(){
 if(!state.ownerToken)return '';
 const active=state.bookings.filter(b=>['pending','accepted','suggested','confirmed','in_progress'].includes(b.status));
 const priority=b=>b.status==='suggested'?0:1;
 const upcoming=active.filter(b=>b.status==='suggested'||b.status==='in_progress'||zenoVisitAt(b).slice(0,10)>=today())
  .sort((a,b)=>priority(a)-priority(b)||zenoVisitAt(a).localeCompare(zenoVisitAt(b)));
 const booking=upcoming[0];
 if(!booking)return '';
 const raw=zenoVisitAt(booking),[date,time='']=raw.trim().split(' ');
 const dateObj=new Date(date+'T00:00:00');
 const next=new Date(today()+'T00:00:00Z');next.setUTCDate(next.getUTCDate()+1);
 const tomorrow=next.toISOString().slice(0,10);
 const dateLabel=date===today()?'오늘':date===tomorrow?'내일':Number.isNaN(dateObj.getTime())?date:dateObj.toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
 const [hhText,mm='00']=time.split(':'),hh=Number(hhText);
 const timeLabel=Number.isInteger(hh)&&hh>=0&&hh<=23?(hh<12?'오전 ':'오후 ')+(hh%12||12)+':'+mm:time;
 const h=hospitalById(booking.hospitalId);
 return '<section class="zeno-home-booking"><span class="zeno-mini-label">내 예약</span><button type="button" data-nav="bookings"><strong>'+e(booking.petName||'반려동물')+' · '+e(dateLabel)+' '+e(timeLabel)+' · '+e(STATUS[booking.status]||booking.status)+'</strong><small>'+e(h?.name||'예약 병원 확인')+'</small></button></section>';
}

/* ZENO pet portrait upload (2026-11-08): local preview, downscale and EXIF-free encoded thumbnail.
   Portraits live in an owner-private D1 table, not in the 55 KB health-profile payload. */
function zenoPetPhotoSource(value){
 const s=typeof value==='string'?value:'';
 if(s.length>80000)return '';
 if(/^data:image\/(?:webp|jpeg|png);base64,[A-Za-z0-9+/]+={0,2}$/.test(s))return s;
 return /^https:\/\/[a-z0-9.-]+\//i.test(s)?s:'';
}
async function zenoCompressPetPhoto(file){
 if(!(file instanceof File))throw Error('사진을 먼저 선택해 주세요.');
 if(file.size>10*1024*1024)throw Error('10MB 이하 사진을 선택해 주세요.');
 if(!/^image\/(?:jpeg|png|webp|heic|heif)$/.test(file.type)&&!(!file.type&&/\.(?:jpe?g|png|webp|heic|heif)$/i.test(file.name)))throw Error('JPG, PNG, WebP 또는 HEIC 사진을 선택해 주세요.');
 let source=null,objectUrl=null;
 try{
  if(typeof createImageBitmap==='function'){try{source=await createImageBitmap(file)}catch{}}
  if(!source){
   objectUrl=URL.createObjectURL(file);
   source=await new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(Error('이 사진을 읽을 수 없어요. JPG나 PNG로 다시 선택해 주세요.'));
    img.src=objectUrl;
   });
  }
  const iw=source.width||source.naturalWidth,ih=source.height||source.naturalHeight;
  if(!iw||!ih)throw Error('사진 크기를 읽지 못했어요.');
  const side=Math.min(iw,ih);
  const sx=(iw-side)/2,sy=(ih-side)/2;
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
  if(!ctx)throw Error('이 기기에서 사진을 처리하지 못했어요.');
  for(const dimension of [320,256,192,144]){
   canvas.width=dimension;canvas.height=dimension;
   ctx.clearRect(0,0,dimension,dimension);
   ctx.drawImage(source,sx,sy,side,side,0,0,dimension,dimension);
   for(const type of ['image/webp','image/jpeg']){
    for(const quality of [.8,.64,.48]){
     const data=canvas.toDataURL(type,quality);
     if(zenoPetPhotoSource(data)&&data.startsWith('data:image/')&&data.length<=75000)return data;
    }
   }
  }
  throw Error('사진 크기를 줄일 수 없어요. 다른 사진으로 시도해 주세요.');
 }finally{
  if(source&&typeof source.close==='function')source.close();
  if(objectUrl)URL.revokeObjectURL(objectUrl);
 }
}

function zenoPriceCategory(label){
 const s=String(label||'').replace(/\s+/g,'').toLowerCase();
 if(/초진|첫진료|초진료/.test(s))return '초진 진찰료';
 if(/재진|재진료/.test(s))return '재진 진찰료';
 if(/건강검진|종합검진|검진/.test(s))return '건강검진';
 if(/예방접종|종합백신|접종|백신/.test(s))return '예방접종';
 if(/엑스레이|x-ray|xray|방사선/.test(s))return '엑스레이';
 if(/초음파/.test(s))return '초음파';
 if(/혈액검사|혈액/.test(s))return '혈액검사';
 return String(label||'기타');
}

 }catch(err){toast(err.message)}
 finally{if(submit)submit.disabled=false}
 return;
}
if(id==='record-form'){state.records.push({id:uid(),petId:d.petId,kind:d.kind,date:d.date,memo:val(d.memo)});savePersonal();state.modal=null;render();toast('건강 기록을 저장했습니다.');return}

window.addEventListener('storage',ev=>{if([STOREKEY,'zeno-pets-v2','zeno-records-v2','zeno-favorites-v2'].includes(ev.key)){state.pets=JSON.parse(localStorage.getItem('zeno-pets-v2')||'[]');state.records=JSON.parse(localStorage.getItem('zeno-records-v2')||'[]');state.favorites=JSON.parse(localStorage.getItem('zeno-favorites-v2')||'[]');refresh()}});
window.addEventListener('zeno-refresh',()=>{});
let zenoStarted=false,zenoStartPending=false,zenoStartRetry=null,zenoStartFailures=0,zenoPollTimer=null;
function zenoCanPoll(){return !document.hidden&&navigator.onLine!==false&&state.serverReady&&!!(APP_MODE==='hospital'?state.hospitalToken:state.ownerToken)}
function zenoPoll(){
 if(!zenoCanPoll())return;
 refresh().catch(err=>console.warn('ZENO background sync:',err));
}
async function start(){
 if(zenoStarted||zenoStartPending)return;
 zenoStartPending=true;
 try{
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),8000);
  let ready=false;
  try{
   const r=await fetch('/api/ping',{cache:'no-store',signal:controller.signal});
   if(r.ok){const x=await r.json();ready=!!x.connected}
  }catch(err){console.warn('ZENO connectivity:',err)}
  finally{clearTimeout(timeout)}
  state.local=!ready;state.serverReady=ready;
  if(!ready){
   state.appError='서버 연결을 재시도 중입니다.';
   render();
   zenoStartFailures++;
   const delay=Math.min(30000,5000*Math.pow(2,Math.min(zenoStartFailures-1,3)));
   if(!zenoStartRetry)zenoStartRetry=setTimeout(()=>{zenoStartRetry=null;start()},delay);
   return;
  }
  zenoStartFailures=0;
  state.appError='';
  if(APP_MODE==='owner'&&state.ownerToken){
   try{const x=await api('GET','/api/auth/me');state.owner=x.owner;ownerId=x.owner.id}
   catch(err){if(/인증|401|로그인/.test(err.message)){state.ownerToken='';state.owner=null;localStorage.removeItem('zeno-owner-auth')}}
  }
  await refresh();
  zenoStarted=true;
  if(!zenoPollTimer)zenoPollTimer=setInterval(zenoPoll,25000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)zenoPoll()});
  window.addEventListener('online',()=>{if(!state.serverReady){start()}else zenoPoll()});
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
 }finally{zenoStartPending=false}
}
render();start();
const ZENO_OWNER_UI_REVISION='20261113-fee-all-care-v18';
let zenoLastUIVersionCheck=0;
let zenoUIVersionChecking=false;
async function zenoCheckOwnerUIRevision(force=false){
 if(zenoUIVersionChecking||document.hidden||state.modal||state.profileSaving||state.bookingSubmitting||document.activeElement?.closest('form'))return;
 const now=Date.now();
 if(!force&&now-zenoLastUIVersionCheck<90000)return;
 zenoLastUIVersionCheck=now;
 zenoUIVersionChecking=true;
 try{
  const response=await fetch('/api/ui-version?ts='+now,{cache:'no-store',credentials:'same-origin'});
  if(!response.ok)return;
  const data=await response.json();
  if(!data?.owner||data.owner===ZENO_OWNER_UI_REVISION)return;
  if(document.hidden||state.modal||state.profileSaving||state.bookingSubmitting||document.activeElement?.closest('form'))return;
  // Never loop when an older browser cache keeps returning the same HTML after an update.
  if(new URLSearchParams(window.location.search).get('ui')===data.owner)return;
  window.location.replace('/owner?ui='+encodeURIComponent(data.owner));
 }catch(error){/* Keep the existing page during network outages. */}
 finally{zenoUIVersionChecking=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)zenoCheckOwnerUIRevision(true)});
window.addEventListener('pageshow',()=>zenoCheckOwnerUIRevision());
setInterval(()=>zenoCheckOwnerUIRevision(),180000);
/* Guests and logged-in users see changed evening hours without a reload. */
setInterval(()=>{if(document.hidden)return;if(state.page==='emergency'||(state.page==='search'&&zenoHasFilter('야간')))render();},60000);
/* CHANGED: refresh guest-visible clinic intake every minute; no simulated live counters. */
setInterval(()=>{if(document.hidden||state.ownerToken||!state.serverReady)return;refresh().catch(()=>{});},60000);

<button id="memopen" type="button">추모관</button><div id="membg" role="dialog" aria-modal="true"><div id="memcard"><button id="memclose" type="button">닫기</button><h2>우리 아이 추모관</h2><p>보호자가 원할 때만 추모 기록을 만듭니다. 기존 진료 기록과 병원 정보는 변경하지 않습니다.</p><select id="mempet"><option value="">반려동물 선택</option></select><input id="memtitle" maxlength="100" placeholder="추억의 제목"><textarea id="memtext" maxlength="3000" rows="5" placeholder="우리 아이에게 남기는 편지"></textarea><label><input id="memagree" type="checkbox"> 추모 기록 만들기에 동의합니다</label><div><button id="memsave" type="button">추억 저장</button></div><p style="font-size:12px">현재 브라우저에만 저장됩니다. 브라우저 데이터를 삭제하면 사라질 수 있습니다.</p><h3>저장한 추억</h3><div id="memlist"></div></div></div>
<script>(()=>{const $=x=>document.getElementById(x),key='zeno-memorial-v1',read=k=>{try{let a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch{return []}},esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderMem(){let pets=read('zeno-pets-v2');$('mempet').innerHTML='<option value="">반려동물 선택</option>'+pets.map((p,i)=>'<option value="'+i+'">'+esc(p.name||p.petName||'이름 미등록')+'</option>').join('');$('memlist').innerHTML=read(key).map(m=>'<div style="border-top:1px solid #ddd;padding:12px 0"><b>'+esc(m.pet)+' · '+esc(m.title)+'</b><p style="white-space:pre-wrap">'+esc(m.text)+'</p><button data-del="'+esc(m.id)+'">삭제</button></div>').join('')||'저장된 추억이 없습니다.'}$('memopen').onclick=()=>{$('membg').classList.add('show');renderMem()};$('memclose').onclick=()=>$('membg').classList.remove('show');$('memsave').onclick=()=>{let i=$('mempet').value,p=read('zeno-pets-v2')[Number(i)],title=$('memtitle').value.trim(),text=$('memtext').value.trim();if(i===''||!p)return alert('반려동물을 먼저 등록하고 선택해 주세요.');if(!$('memagree').checked)return alert('보호자 동의가 필요합니다.');if(!title||!text)return alert('제목과 추억을 입력해 주세요.');let a=read(key);a.push({id:String(Date.now()),pet:p.name||p.petName||'이름 미등록',title,text});try{localStorage.setItem(key,JSON.stringify(a));$('memtitle').value='';$('memtext').value='';$('memagree').checked=false;renderMem();alert('추모 기록이 저장되었습니다.')}catch{alert('브라우저 저장에 실패했습니다.')}};$('memlist').onclick=e=>{let b=e.target.closest('[data-del]');if(b&&confirm('이 추모 기록을 삭제할까요?')){localStorage.setItem(key,JSON.stringify(read(key).filter(x=>x.id!==b.dataset.del)));renderMem()}}})();</script></body></html>
