function connected(h){return !!h.linked}
function hs(id){return state.settings[id]||{status:'check',updatedAt:null,notice:'',services:[],prices:[],emergency:false}}
function statusWidget(h){const s=hs(h.id);return `<span class="status ${h.linked?s.status:'check'}">● ${!h.linked?'상태 미연동':s.status==='available'?'수용 가능 · 데모':s.status==='busy'?'혼잡 · 데모':'확인 필요 · 데모'}</span>`}
function hospitalCard(h){const s=hs(h.id);return `<article class="hospital"><div class="hospital-header"><div class="hospital-title"><div class="hlogo">✚</div><div><h3>${e(h.name)}</h3><p>📍 ${e(h.region)}</p></div></div><button class="btn ghost small" data-action="favorite" data-id="${h.id}" title="즐겨찾기">${state.favorites.includes(h.id)?'♥':'♡'}</button></div><div class="tags">${h.is24?'<span class="tag blue">24시간 운영 안내</span>':''}${h.linked?'<span class="tag teal">제노 연결 체험</span>':'<span class="tag">정보 조회</span>'}${h.tags.slice(0,3).map(x=>`<span class="tag">${e(x)}</span>`).join('')}${(s.services||[]).slice(0,2).map(x=>`<span class="tag blue">시연: ${e(x)}</span>`).join('')}</div><div>${statusWidget(h)} <span class="tiny">${h.linked?e(updateText(s.updatedAt)):'진료 가능 여부는 전화 확인'}</span></div><p style="min-height:30px">${e(h.desc)}</p><div class="hfooter"><span class="tiny">${e(h.hours)}</span><div class="actions"><button class="btn secondary small" data-action="details" data-id="${h.id}">상세 보기</button>${h.linked?`<button class="btn small" data-action="book" data-id="${h.id}">예약 요청</button>`:h.phone?`<a class="btn small" href="tel:${e(h.phone)}">전화</a>`:''}</div></div></article>`}
function hospitalResults(items){return items.length?`<div class="hospital-list">${items.map(hospitalCard).join('')}</div>`:`<div class="empty"><span class="big">🔎</span><strong>조건에 맞는 등록 병원이 없습니다.</strong><p>특수동물·전문과 진료 여부는 확인되지 않은 병원을 추천하지 않습니다.</p><button class="btn secondary small" data-action="clear-search">전체 병원 보기</button></div>`}
function filteredHospitals(){let list=HOSPITALS.filter(h=>(!state.query||(h.name+' '+h.address+' '+h.tags.join(' ')).toLowerCase().includes(state.query.toLowerCase())));if(state.filter==='24시')list=list.filter(x=>x.is24);if(state.filter==='연결 병원')list=list.filter(x=>x.linked);if(state.filter==='즐겨찾기')list=list.filter(x=>state.favorites.includes(x.id));if(state.specialty)list=list.filter(x=>state.specialty==='특수동물'?(state.exoticSpecies?(hs(x.id).services||[]).includes(state.exoticSpecies):(hs(x.id).services||[]).some(v=>['토끼','햄스터','조류','파충류'].includes(v))):x.cats.includes(state.specialty)||(hs(x.id).services||[]).includes(state.specialty));return list}
function ad(){return `<div class="adline"><div><span class="tiny">광고 · 제휴 시연 영역</span><strong>반려동물에게 필요한 것, 제노에서 함께</strong><small>사료사·동물병원 제휴 배너는 실제 광고 계약 후 노출됩니다.</small></div><button class="btn secondary small" data-nav="membership">혜택 보기</button></div>`}
function home(){let cnt=state.bookings.filter(b=>!['done','cancelled','rejected'].includes(b.status)).length;return `${topbar('안녕하세요, 보호자님','필요한 순간, 필요한 진료를 찾다.')}<div class="hero"><div style="z-index:1"><div class="eyebrow">ZENO | PET MEDICAL PLATFORM</div><h2>검색은 짧게,<br><em>행동은 빠르게.</em></h2><p>우리 아이에게 맞는 진료를 찾고<br>병원 상태 확인부터 예약 요청까지.</p><div class="buttons"><button class="btn" data-nav="search">병원 찾기 ↗</button><button class="btn secondary" data-nav="emergency">✚ 지금 응급 진료</button></div></div><div class="hero-graphic">🐈</div></div><div class="metric-grid"><div class="metric"><span class="micon">🏥</span><strong>5곳</strong><small>청주 등록 병원</small></div><div class="metric"><span class="micon">⇄</span><strong>3곳</strong><small>양방향 데모</small></div><div class="metric"><span class="micon">📅</span><strong>${cnt}건</strong><small>진행 중 내 예약</small></div></div><div class="section" style="margin-top:17px">${ad()}</div><div class="section"><div class="section-title"><h2>어떤 진료가 필요하세요?</h2><span>목적에 맞춰 찾기</span></div><div class="grid three">${SPECIALTIES.map(x=>`<button class="choice speciality" data-action="specialty" data-value="${x[0]}"><div class="circle">${x[1]}</div><strong>${x[0]}</strong><p>${x[2]}</p></button>`).join('')}</div></div><div class="section"><div class="section-title"><h2>지금 병원 찾기</h2><button class="link" data-nav="search">전체 병원 보기 →</button></div>${hospitalResults([HOSPITALS[1],HOSPITALS[2]])}</div><div class="section"><div class="section-title"><h2>제노의 연결 경험</h2></div><div class="grid three">${[['📞','응급 진료','병원 운영 상태를 확인하고 전화로 최종 확인'],['📝','건강 기록','예방접종·검진 결과·자주 가는 병원 기록'],['💬','질문·답변','증상 질문을 남기고 병원에서 답변 관리']].map(x=>`<div class="panel"><div style="font-size:25px">${x[0]}</div><h3 style="margin-top:12px">${x[1]}</h3><div class="desc">${x[2]}</div></div>`).join('')}</div></div>`}
function searchPage(){return `${topbar('내게 맞는 병원 찾기','청주 지역 등록 병원 · 진료 상태는 실제 수용 보장이 아닙니다.')}<div class="banner">병원명·주소·연락처는 공개 자료로 확인한 정보입니다. <strong>실시간 상태·예약 기능은 3개 병원의 시연 데이터</strong>이며 실제 진료 접수와 연결되지 않습니다.</div><div class="searchrow"><input class="search" id="hospital-search" placeholder="병원명, 지역, 진료과 검색" value="${e(state.query)}"><button class="btn" data-action="search-apply">검색</button></div><div class="filters">${['전체','24시','연결 병원','즐겨찾기'].map(x=>`<button class="filter ${state.filter===x?'active':''}" data-action="filter" data-value="${x}">${x}</button>`).join('')}</div>${state.specialty?`<div class="banner" style="margin:12px 0">선택된 분야: <strong>${e(state.exoticSpecies||state.specialty)}</strong> <button class="link" data-action="clear-specialty">필터 해제 ×</button></div>`:''}<div class="section-title"><h2>등록 병원 <span class="countdot">${filteredHospitals().length}곳</span></h2><span>마지막 갱신 표시</span></div>${hospitalResults(filteredHospitals())}<div class="section"><h2 class="sectionhead">특수동물 진료 병원 찾기</h2><div class="grid four">${EXOTIC.map(x=>`<button class="choice" data-action="exotic" data-value="${x[0]}"><div class="circle">${x[1]}</div><strong>${x[0]}</strong><p>진료 가능 병원 확인</p></button>`).join('')}</div><p class="notice">현재 5곳 중 특수동물 진료가 확인된 병원 정보가 없어 검색 결과를 임의 생성하지 않습니다.</p></div>`}
function emergency(){let list=HOSPITALS.filter(h=>h.is24);return `${topbar('24시간 · 응급 진료 찾기','진료 필요 시 병원에 전화해 수용 여부를 최종 확인하세요.')}<div class="hero" style="min-height:185px;padding:30px"><div><div class="eyebrow">URGENT CARE</div><h2 style="font-size:27px">응급일수록,<br><em>먼저 전화로 확인하세요.</em></h2><p>24시간 운영 안내와 실제 응급 수용 가능 여부는 다를 수 있습니다.</p></div><div class="hero-graphic" style="font-size:55px">📞</div></div><div class="section"><div class="section-title"><h2>24시간 운영 안내 병원</h2><span>${list.length}곳</span></div>${hospitalResults(list)}</div><div class="banner warning">주의: 아래 상태 표시의 '수용 가능'은 <strong>시연용 병원 관리자가 입력한 값</strong>입니다. 실제 동물병원의 진료 가능 여부를 나타내지 않습니다. 병원 방문 전 반드시 실제 전화로 확인하세요.</div><div class="section"><button class="btn secondary full" data-nav="search">청주 전체 병원 보기</button></div>`}
function petsPage(){let cards=state.pets.map(p=>`<div class="panel pet-card"><div class="petavatar">${p.species==='고양이'?'🐱':p.species==='강아지'?'🐶':'🐾'}</div><div class="details"><h3>${e(p.name)}</h3><p>${e(p.species)} · ${e(p.age||'나이 미입력')} · ${e(p.weight||'체중 미입력')}</p></div><button class="btn secondary small" data-action="record" data-id="${e(p.id)}">기록 추가</button><button class="btn ghost small" data-action="delete-pet" data-id="${e(p.id)}">×</button></div>`).join('');return `${topbar('내 아이 건강 기록','예방접종부터 검진 결과, 단골병원까지 한눈에')}<div class="banner">기록은 이 기기의 브라우저에만 저장됩니다. 병원 진료기록과 자동 연동되거나 의료기관에 공유되지 않습니다.</div><div class="section"><div class="section-title"><h2>등록한 아이 <span class="countdot">${state.pets.length}</span></h2><button class="btn small" data-action="add-pet">+ 아이 등록</button></div><div class="grid two">${cards||'<div class="empty"><span class="big">🐾</span>아이를 먼저 등록해 주세요.</div>'}</div></div><div class="section"><div class="section-title"><h2>예방접종 · 건강검진 기록</h2></div><div class="panel">${state.records.length?state.records.slice().reverse().map(r=>{let p=state.pets.find(x=>x.id===r.petId);return `<div class="row-line"><div><strong>${e(r.kind)} · ${e(p?.name||'삭제된 아이')}</strong><div class="sub">${e(r.date)} · ${e(r.memo||'메모 없음')}</div></div><button class="btn ghost small" data-action="delete-record" data-id="${e(r.id)}">삭제</button></div>`}).join(''):'<div class="empty">등록된 건강 기록이 없습니다.</div>'}</div></div><div class="section"><div class="section-title"><h2>단골 병원</h2></div>${hospitalResults(HOSPITALS.filter(x=>state.favorites.includes(x.id)))}</div>`}
function bookingCard(b,hospital=false){let h=hospitalById(b.hospitalId),step={pending:1,accepted:2,suggested:2,confirmed:3,in_progress:3,done:4,cancelled:1,rejected:1}[b.status]||1;return `<article class="booking-card"><div class="head"><div><h3>${hospital?e(b.petName):e(h?.name||'병원 정보 없음')}</h3><p>${hospital?e(b.petName)+' · '+e(b.species):e(b.petName)+' · '+e(b.species)} / ${e(b.service)}</p></div><span class="status ${b.status==='confirmed'?'available':b.status==='pending'?'busy':''}">${e(STATUS[b.status]||b.status)}</span></div><div class="booking-steps">${[1,2,3,4].map(n=>`<div class="${n<=step?'done':''}"></div>`).join('')}</div><p><strong>희망일:</strong> ${e(b.date)} ${e(b.time)} ${b.proposedAt?`<br><strong>병원 제안:</strong> ${e(b.proposedAt.replace('T',' '))}`:''}</p>${b.note?`<p>증상·요청: ${e(b.note)}</p>`:''}${b.hospitalNote?`<p style="background:#edf7ff;border-radius:8px;padding:9px"><strong>병원 메모:</strong> ${e(b.hospitalNote)}</p>`:''}<div class="buttons">${hospital?hospitalBookingButtons(b):ownerBookingButtons(b)}</div><p class="tiny">접수 ${dateTime(b.createdAt)} · 마지막 변경 ${dateTime(b.updatedAt)}</p></article>`}
function ownerBookingButtons(b){let s=b.status;return `${s==='suggested'?`<button class="btn small teal" data-action="owner-confirm" data-id="${e(b.id)}">제안 시간 확정</button>`:''}${['pending','accepted','suggested'].includes(s)?`<button class="btn secondary small" data-action="owner-cancel" data-id="${e(b.id)}">요청 취소</button>`:''}${s==='done'&&!state.reviews.some(x=>x.bookingId===b.id)?`<button class="btn small" data-action="review" data-id="${e(b.id)}">방문 인증 후기 작성</button>`:''}${s==='done'&&state.reviews.some(x=>x.bookingId===b.id)?'<span class="tag teal">후기 작성 완료 · 100P 적립</span>':''}${s==='confirmed'?'<span class="tag teal">병원 데모 예약 확정</span>':''}`}
function hospitalBookingButtons(b){let s=b.status;return `${['pending','accepted'].includes(s)?`<button class="btn small teal" data-action="hospital-update" data-status="${s==='pending'?'accepted':'confirmed'}" data-id="${e(b.id)}">${s==='pending'?'예약 수락':'예약 확정'}</button>`:''}${['pending','accepted','suggested'].includes(s)?`<button class="btn small secondary" data-action="propose" data-id="${e(b.id)}">시간 제안</button><button class="btn small red" data-action="hospital-update" data-status="rejected" data-id="${e(b.id)}">거절</button>`:''}${s==='confirmed'?`<button class="btn small teal" data-action="hospital-update" data-status="in_progress" data-id="${e(b.id)}">진료 시작</button><button class="btn small secondary" data-action="hospital-update" data-status="done" data-id="${e(b.id)}">진료 완료</button>`:''}${s==='in_progress'?`<button class="btn small teal" data-action="hospital-update" data-status="done" data-id="${e(b.id)}">진료 완료</button>`:''}`}
function bookingsPage(){let b=state.bookings.filter(x=>state.bookingTab==='전체'||x.status===state.bookingTab).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `${topbar('나의 예약 · 진행 상태','병원에 예약을 요청하고 응답을 확인할 수 있습니다.')}<div class="banner">이 화면의 예약은 실제 병원 예약이 아닌 <strong>제노 데모 예약</strong>입니다. 실제 진료를 예약하려면 병원에 직접 전화해 주세요.</div><div class="tabs">${[['전체','전체'],['pending','확인 대기'],['suggested','시간 제안'],['confirmed','확정'],['done','진료 완료']].map(x=>`<button data-action="booking-tab" data-value="${x[0]}" class="${state.bookingTab===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="section"><div class="grid two">${b.map(x=>bookingCard(x)).join('')||'<div class="empty"><span class="big">📆</span>아직 해당 예약이 없습니다.<p>병원을 선택하고 예약을 요청해 보세요.</p><button class="btn small" data-nav="search">병원 찾기</button></div>'}</div></div>`}
function qaPage(){return `${topbar('동물병원 질문 · 답변','증상 사진 대신 질문 내용을 입력하고 병원 데모 답변을 받아보세요.')}<div class="banner warning">PPT의 ‘자격 확인된 수의사’ 기능을 목표로 합니다. <strong>현재 의료진 자격 검증·실제 의료 상담·사진 첨부는 연결되지 않았습니다.</strong> 답변은 데모 병원용 계정에서 입력한 시연 내용입니다. 응급 증상은 즉시 병원에 전화하세요.</div><div class="section"><div class="section-title"><h2>질문 보내기</h2><button class="btn small" data-action="ask">+ 새 질문</button></div><div class="grid two">${state.questions.map(q=>`<div class="panel"><span class="status ${q.status==='answered'?'available':'busy'}">${q.status==='answered'?'답변 등록':'답변 대기'}</span><h3 style="margin-top:10px">${e(hospitalById(q.hospitalId)?.name||'')}</h3><p class="desc">${e(q.petName||'반려동물')} · ${dateTime(q.createdAt)}</p><p class="preline">${e(q.text)}</p><div class="divider"></div><strong>병원 데모 답변</strong><p class="desc preline">${e(q.answer||'아직 답변이 등록되지 않았습니다.')}</p></div>`).join('')||'<div class="empty"><span class="big">💬</span>아직 질문이 없습니다.</div>'}</div></div>`}
function membership(){const points=state.reviews.reduce((a,x)=>a+(x.points||0),0);return `${topbar('제노 멤버십 · 포인트','이용자는 모으고, 수익은 다각화합니다.')}<div class="grid two"><div class="panel" style="background:linear-gradient(120deg,#0a2342,#154b83);color:white"><span class="pill">B2C · 보호자</span><p style="margin:22px 0 3px;color:#b9d7ee">프리미엄 멤버십 · 기획 요금</p><div class="price-line"><strong>월 1,800원</strong></div><p style="color:#b9d7ee">정식 결제 전, 할인 계산만 체험 가능합니다.</p><button class="btn" data-action="point-calc">포인트 적용 계산</button></div><div class="panel"><span class="pill">ZENO POINTS</span><div class="large-num" style="margin-top:24px">${points.toLocaleString()} P</div><p class="desc">데모 예약을 병원 측에서 '진료 완료' 처리한 후 후기를 작성하면 100P를 적립하는 시연 규칙입니다.</p><button class="btn secondary small" data-nav="bookings">완료된 예약 확인</button></div></div><div class="section"><div class="section-title"><h2>사업 확장 시연</h2></div><div class="grid three">${[['🏷️','광고·제휴','사료사, 브랜드, 병원 홍보'],['🛍️','펫 이커머스','병원 외 일상에서도 재방문'],['🏥','병원 운영 도구','예약·문의·상태관리 고도화']].map(x=>`<div class="panel"><div class="product-icon">${x[0]}</div><h3 style="margin-top:14px">${x[1]}</h3><p class="desc">${x[2]}</p><span class="tag">향후 계획 · 비활성</span></div>`).join('')}</div></div><div class="section">${ad()}</div>`}

if(m.type==='point'){let p=state.reviews.reduce((a,x)=>a+(x.points||0),0),discount=Math.min(p,1800),cost=1800-discount;title='멤버십 포인트 계산';body=`<p class="desc">멤버십 월 요금 <strong>1,800원</strong> · 현재 포인트 <strong>${p}P</strong></p><div class="panel" style="margin-top:17px;background:#f0f8ff"><div class="row-line"><span>월 요금</span><strong>1,800원</strong></div><div class="row-line"><span>보유 포인트 적용</span><strong>-${discount}P</strong></div><div class="row-line"><span>가상 결제 금액</span><strong style="font-size:27px;color:var(--blue)">${cost.toLocaleString()}원</strong></div></div><p class="notice">1P=1원 가정의 PPT 기반 시뮬레이션입니다. 실제 결제·포인트 사용·구독 등록은 되지 않습니다.</p>`}
return `<div class="modalbg" data-action="modal-backdrop"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${e(title)}"><div class="modal-head"><h2>${e(title)}</h2><button class="close" data-action="close-modal" aria-label="닫기">×</button></div>${body}</div></div>`}

function render(){if(APP_MODE==='owner'&&!state.ownerToken){document.getElementById('app').innerHTML=authScreen();return;}if(APP_MODE==='hospital')state.page='hospital';else if(state.page==='hospital'||state.page==='admin')state.page='home';const body=state.page==='home'?home():state.page==='search'?searchPage():state.page==='emergency'?emergency():state.page==='pets'?petsPage():state.page==='bookings'?bookingsPage():state.page==='qa'?qaPage():state.page==='membership'?membership():state.page==='prices'?pricesPage():state.page==='hospital'?hospitalPage():state.page==='more'?morePage():adminPage();document.getElementById('app').innerHTML=`${nav()}<main class="content">${state.appError?`<div class="banner warning">서버 오류: ${e(state.appError)}</div>`:''}<div class="banner ${state.local?'warning':''}" style="margin-bottom:16px"><strong>${state.local?'서버 설정 필요':'공유 서버 연결 모드'}</strong> · ${state.local?'현재 서버가 연결되지 않았습니다. 이 앱은 서버 배포 후 사용할 수 있습니다.':'보호자와 병원 앱이 같은 데이터베이스를 이용합니다. 12초 간격 자동 갱신 · 실제 병원 공식 접수와는 별개입니다.'}</div>${body}${footer()}</main>${renderModal()}`;}
function openModal(type,id){state.modal={type,id};render()}
async function afterMutation(p=''){try{await refresh();if(p)toast(p)}catch(err){toast(err.message)}}
async function mutate(method,path,data,message){try{await api(method,path,data);state.modal=null;await afterMutation(message||'저장되었습니다.')}catch(err){toast(err.message)}}
document.addEventListener('click',async ev=>{let n=ev.target.closest('[data-nav]');if(n){navTo(n.dataset.nav);return}let el=ev.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id,val=el.dataset.value;
if(a==='close-modal'){state.modal=null;render();return}if(a==='modal-backdrop'){if(ev.target===el){state.modal=null;render()}return}
if(a==='auth-mode'){state.authMode=val;render();return}
if(a==='owner-logout'){clearTimeout(profileSaveTimer);state.ownerToken='';state.owner=null;ownerId='';state.pets=[];state.records=[];state.favorites=[];state.bookings=[];state.questions=[];state.reviews=[];state.authMode='login';localStorage.removeItem('zeno-owner-auth');render();return}
if(a==='refresh'){await refresh();toast('최신 정보를 불러왔습니다.');return}
if(a==='details'||a==='book'){openModal(a==='details'?'details':'book',id);return}
if(a==='filter'){state.filter=val;render();return}if(a==='booking-tab'){state.bookingTab=val;render();return}
if(a==='search-apply'){state.query=document.getElementById('hospital-search')?.value.trim()||'';render();return}
if(a==='specialty'){state.specialty=val;state.exoticSpecies='';state.filter='전체';navTo('search');return}
if(a==='clear-specialty'){state.specialty='';state.exoticSpecies='';render();return}if(a==='clear-search'){state.query='';state.specialty='';state.exoticSpecies='';state.filter='전체';render();return}
if(a==='exotic'){state.specialty='특수동물';state.exoticSpecies=val;state.query='';state.filter='전체';render();toast(val+' 진료는 병원 데모 설정 기준으로만 표시됩니다.');return}
if(a==='favorite'){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];savePersonal();render();return}
if(a==='add-pet'){openModal('pet');return}if(a==='record'){openModal('record',id);return}
if(a==='delete-pet'){if(confirm('아이 정보를 삭제하시겠습니까?')){state.pets=state.pets.filter(x=>x.id!==id);state.records=state.records.filter(x=>x.petId!==id);savePersonal();render()}return}
if(a==='delete-record'){if(confirm('이 기록을 삭제하시겠습니까?')){state.records=state.records.filter(x=>x.id!==id);savePersonal();render()}return}
if(a==='ask'){openModal('ask');return}if(a==='point-calc'){openModal('point');return}if(a==='review'){openModal('review',id);return}
if(a==='owner-cancel'){if(confirm('예약 요청을 취소하시겠습니까?'))await mutate('PATCH','/api/bookings/'+id,{status:'cancelled',side:'owner'},'예약 요청을 취소했습니다.');return}
if(a==='owner-confirm'){if(confirm('병원이 제안한 시간으로 확정하시겠습니까?'))await mutate('PATCH','/api/bookings/'+id,{status:'confirmed',side:'owner'},'제안된 시간으로 확정했습니다.');return}
if(a==='hospital-logout'){state.hospitalToken='';sessionStorage.removeItem('zeno-h-token');sessionStorage.removeItem('zeno-h-hospital');state.hospitalBookings=[];state.hospitalQuestions=[];render();return}
if(a==='admin-logout'){state.adminToken='';sessionStorage.removeItem('zeno-admin-token');render();return}
if(a==='h-tab'){state.hTab=val;render();return}
if(a==='change-status'){await mutate('PATCH','/api/settings',{status:val},'병원 상태가 보호자용 화면에 반영되었습니다.');return}
if(a==='hospital-update'){let label=STATUS[el.dataset.status]||'변경';if(confirm('예약을 '+label+' 처리하시겠습니까?'))await mutate('PATCH','/api/bookings/'+id,{status:el.dataset.status,side:'hospital'},'예약 상태를 변경했습니다.');return}
if(a==='propose'){openModal('propose',id);return}
if(a==='answer'){let answer=document.getElementById('answer-'+id)?.value.trim();if(!answer||answer.length<3){toast('답변을 3자 이상 입력해 주세요.');return}await mutate('PATCH','/api/questions/'+id,{answer},'답변을 저장했습니다.');return}
if(a==='price-remove'){let s=hs(state.activeHospital),prices=[...(s.prices||[])];prices.splice(Number(id),1);await mutate('PATCH','/api/settings',{prices},'가격 예시 항목을 삭제했습니다.');return}
if(a==='service-remove'){let services=(hs(state.activeHospital).services||[]).filter(x=>x!==val);await mutate('PATCH','/api/settings',{services},'진료 과목 시연 항목을 삭제했습니다.');return}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&state.modal){state.modal=null;render()}if(ev.key==='Enter'&&document.activeElement?.id==='hospital-search'){state.query=document.activeElement.value.trim();render()}});
document.addEventListener('submit',async ev=>{let f=ev.target,id=f.id;if(!id)return;ev.preventDefault();let d=Object.fromEntries(new FormData(f).entries());const val=s=>String(s||'').trim();

  try{const mode=state.authMode==='register'?'register':'login';let payload={username:val(d.username),password:d.password};if(mode==='register')payload.displayName=val(d.displayName);

  }catch(err){toast(err.message)}return;
}

if(id==='question-form'){if(val(d.text).length<5){toast('질문을 5자 이상 작성해 주세요.');return}await mutate('POST','/api/questions',{hospitalId:d.hospitalId,petName:val(d.petName),text:val(d.text)},'병원용 데모 질문으로 등록되었습니다.');navTo('qa');return}
if(id==='pet-form'){state.pets.push({id:uid(),name:val(d.name),species:d.species,age:val(d.age),weight:val(d.weight)});savePersonal();state.modal=null;render();toast('우리 아이를 등록했습니다.');return}
if(id==='record-form'){state.records.push({id:uid(),petId:d.petId,kind:d.kind,date:d.date,memo:val(d.memo)});savePersonal();state.modal=null;render();toast('건강 기록을 저장했습니다.');return}
if(id==='propose-form'){if(d.proposedAt.slice(0,10)<today()){toast('지난 날짜를 제안할 수 없습니다.');return}await mutate('PATCH','/api/bookings/'+d.bookingId,{status:'suggested',side:'hospital',proposedAt:d.proposedAt,hospitalNote:val(d.hospitalNote)},'보호자에게 시간 변경을 제안했습니다.');return}
if(id==='status-settings'){await mutate('PATCH','/api/settings',{notice:val(d.notice),emergency:!!f.querySelector('[name=emergency]').checked},'병원 운영 안내를 저장했습니다.');return}
if(id==='hospital-service'){const services=[...new Set([...(hs(state.activeHospital).services||[]),val(d.service)])];await mutate('PATCH','/api/settings',{services},'진료 과목을 시연 설정에 추가했습니다.');return}
if(id==='hospital-prices'){let amount=Number(d.priceAmount);if(!Number.isFinite(amount)||amount<0||amount>1e7){toast('금액을 정확하게 입력해 주세요.');return}let s=hs(state.activeHospital),prices=[...(s.prices||[]),{label:val(d.priceLabel),amount}];await mutate('PATCH','/api/settings',{prices},'데모 가격 항목을 등록했습니다.');return}
if(id==='review-form'){if(val(d.text).length<10){toast('후기를 10자 이상 입력해 주세요.');return}await mutate('POST','/api/reviews',{bookingId:d.bookingId,stars:Number(d.stars),text:val(d.text)},'후기 등록 · 시연 포인트 100P가 적립되었습니다.');return}
});
window.addEventListener('storage',ev=>{if([STOREKEY,'zeno-pets-v2','zeno-records-v2','zeno-favorites-v2'].includes(ev.key)){state.pets=JSON.parse(localStorage.getItem('zeno-pets-v2')||'[]');state.records=JSON.parse(localStorage.getItem('zeno-records-v2')||'[]');state.favorites=JSON.parse(localStorage.getItem('zeno-favorites-v2')||'[]');refresh()}});
window.addEventListener('zeno-refresh',()=>{});
async function start(){
 try{
  const r=await fetch('/api/ping',{cache:'no-store'});const x=await r.json();
  state.local=!x.connected;state.serverReady=!!x.connected;
 }catch{state.local=true;state.serverReady=false}
 if(!state.serverReady){state.appError='서버와 데이터베이스 연결을 먼저 완료해야 합니다.';state.ownerToken='';render();return}
 if(APP_MODE==='owner'&&state.ownerToken){
  try{const x=await api('GET','/api/auth/me');state.owner=x.owner;ownerId=x.owner.id}
  catch{state.ownerToken='';state.owner=null;localStorage.removeItem('zeno-owner-auth')}
 }
 await refresh();
 setInterval(()=>{if(!document.hidden&&state.serverReady&&(APP_MODE==='hospital'||state.ownerToken))refresh()},12000);
 if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
render();start();
</script><style>#memopen{position:fixed;bottom:16px;right:16px;z-index:100;border:0;border-radius:25px;background:#1979e6;color:white;padding:14px;font-weight:bold}#membg{display:none;position:fixed;inset:0;background:#091b32b8;z-index:110;overflow:auto;padding:20px}#membg.show{display:block}#memcard{background:white;color:#173452;max-width:560px;margin:4vh auto;border-radius:20px;padding:24px}#memcard input:not([type=checkbox]),#memcard textarea,#memcard select{display:block;width:100%;box-sizing:border-box;margin:9px 0;padding:12px;border:1px solid #ccc;border-radius:8px}#memcard button{padding:10px 14px;background:#1979e6;color:white;border:0;border-radius:9px;margin:5px}</style>
<button id="memopen" type="button">추모관</button><div id="membg" role="dialog" aria-modal="true"><div id="memcard"><button id="memclose" type="button">닫기</button><h2>우리 아이 추모관</h2><p>보호자가 원할 때만 추모 기록을 만듭니다. 기존 진료 기록과 병원 정보는 변경하지 않습니다.</p><select id="mempet"><option value="">반려동물 선택</option></select><input id="memtitle" maxlength="100" placeholder="추억의 제목"><textarea id="memtext" maxlength="3000" rows="5" placeholder="우리 아이에게 남기는 편지"></textarea><label><input id="memagree" type="checkbox"> 추모 기록 만들기에 동의합니다</label><div><button id="memsave" type="button">추억 저장</button></div><p style="font-size:12px">현재 브라우저에만 저장됩니다. 브라우저 데이터를 삭제하면 사라질 수 있습니다.</p><h3>저장한 추억</h3><div id="memlist"></div></div></div>
<script>(()=>{const $=x=>document.getElementById(x),key='zeno-memorial-v1',read=k=>{try{let a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch{return []}},esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderMem(){let pets=read('zeno-pets-v2');$('mempet').innerHTML='<option value="">반려동물 선택</option>'+pets.map((p,i)=>'<option value="'+i+'">'+esc(p.name||p.petName||'이름 미등록')+'</option>').join('');$('memlist').innerHTML=read(key).map(m=>'<div style="border-top:1px solid #ddd;padding:12px 0"><b>'+esc(m.pet)+' · '+esc(m.title)+'</b><p style="white-space:pre-wrap">'+esc(m.text)+'</p><button data-del="'+esc(m.id)+'">삭제</button></div>').join('')||'저장된 추억이 없습니다.'}$('memopen').onclick=()=>{$('membg').classList.add('show');renderMem()};$('memclose').onclick=()=>$('membg').classList.remove('show');$('memsave').onclick=()=>{let i=$('mempet').value,p=read('zeno-pets-v2')[Number(i)],title=$('memtitle').value.trim(),text=$('memtext').value.trim();if(i===''||!p)return alert('반려동물을 먼저 등록하고 선택해 주세요.');if(!$('memagree').checked)return alert('보호자 동의가 필요합니다.');if(!title||!text)return alert('제목과 추억을 입력해 주세요.');let a=read(key);a.push({id:String(Date.now()),pet:p.name||p.petName||'이름 미등록',title,text});try{localStorage.setItem(key,JSON.stringify(a));$('memtitle').value='';$('memtext').value='';$('memagree').checked=false;renderMem();alert('추모 기록이 저장되었습니다.')}catch{alert('브라우저 저장에 실패했습니다.')}};$('memlist').onclick=e=>{let b=e.target.closest('[data-del]');if(b&&confirm('이 추모 기록을 삭제할까요?')){localStorage.setItem(key,JSON.stringify(read(key).filter(x=>x.id!==b.dataset.del)));renderMem()}}})();</script></body></html>
