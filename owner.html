.brand{margin:5px 6px 26px;padding:9px;border-radius:14px;background:#fff}.original-logo{width:204px;max-width:100%;height:auto}
.side-caption{color:#63809b;font-size:12px}.navlink{color:#4c6984;font-size:15px;font-weight:700;min-height:48px}.navlink.active,.navlink:hover{background:#eaf4ff;color:#086ad1}
.sidelow{background:#f0f7ff;border-color:#d7e7f6}.sidelow strong{color:#164c81;font-size:15px}.sidelow p{color:#607b97;font-size:13px}
.content{max-width:1450px;padding:28px 32px 85px}.top h1{font-size:clamp(24px,2.5vw,31px);letter-spacing:-.7px}.top p{font-size:14px}
.mobile-logo{background:#fff;border:1px solid #e3edf7;border-radius:13px;padding:7px 11px;box-shadow:0 4px 15px #1a639013}.mobile-logo img{display:block;width:160px;max-width:100%;height:auto}
.hero{background:linear-gradient(112deg,#fff 0%,#f3f9ff 47%,#dcebff 100%);color:#133657;border:1px solid #d9eafa;box-shadow:0 14px 35px #2672b210}
.hero:before{border-color:#4ca3ed24;box-shadow:0 0 0 44px #58adff09,0 0 0 96px #58adff04}
.hero .eyebrow{color:#1974c8}.hero h2{font-size:clamp(29px,3.3vw,42px);letter-spacing:-1.2px}.hero h2 em{color:#1681f2}.hero p{font-size:15px;color:#536f8e;line-height:1.65}
.zeno-hero-art{display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.zeno-hero-art img{width:clamp(144px,17vw,220px);height:auto;aspect-ratio:1;object-fit:contain;border-radius:27px;box-shadow:0 16px 38px #2366b32b}
.btn{min-height:46px;padding:11px 17px;border-radius:13px;font-size:15px;line-height:1.35;white-space:nowrap}
.btn.small{min-height:39px;padding:8px 12px;font-size:13.5px}
.section-title h2,.sectionhead{font-size:22px}.section-title span{font-size:13px}.section{margin:25px 0}
.metric{border-radius:19px;padding:20px}.metric strong{font-size:25px}.metric small{font-size:13px}
.choice{border-radius:17px;padding:19px;border-color:#e2ebf6}.choice .circle{background:#eaf4ff}.choice strong{font-size:16px}.choice p{font-size:13px}
.panel{border-radius:19px}.panel h3{font-size:18px}.panel .desc{font-size:14px}
.banner{font-size:14px;line-height:1.7;border-radius:14px}.filter,.pill,.tag,.status{font-size:13px}
.search,select,input,textarea{font-size:16px;max-width:100%;min-height:43px}.searchrow{align-items:stretch}
.hospital{border-radius:19px;padding:21px;gap:13px}.hospital h3{font-size:18px;line-height:1.35}.hospital p,.hospital .tiny{font-size:13px;line-height:1.55}
.hospital .hlogo{width:49px;height:49px;border-radius:15px}
.hospital .hfooter{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hospital .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.dashboard-hero{position:relative;background:linear-gradient(112deg,#edf7ff,#dceeff);border:1px solid #cee4fc;color:#163c65;border-radius:20px}
.dashboard-hero h2{color:#163c65}.dashboard-hero p{color:#476c8d;font-size:14px}.dashboard-hero .eyebrow{color:#1479d8!important}
.zeno-hospital-icon{width:92px;height:92px;object-fit:contain;border-radius:22px;box-shadow:0 10px 25px #1869bc22;flex-shrink:0}
.zeno-auth-card{border-radius:24px}.zeno-auth-logo{width:78px;height:78px;border-radius:18px}.auth-tabs button,.auth-tabs .active{font-size:15px}
.mobilebar{box-shadow:0 -7px 24px #1c518013}
:focus-visible{outline:3px solid #62b4ff;outline-offset:3px}
@media(max-width:750px){
 body{font-size:16px}
 .content{margin:0;padding:15px 14px 122px}
 .top{margin-bottom:18px}.top h1{font-size:24px}.top p{font-size:13px}
 .mobile-logo{display:inline-flex;margin-bottom:11px;padding:6px 10px}.mobile-logo img{width:150px;height:auto}
 .hero{padding:24px 20px;min-height:255px;border-radius:21px;align-items:flex-start}
 .hero h2{font-size:clamp(27px,7vw,34px);line-height:1.22}
 .hero p{font-size:14px;max-width:240px}
 .hero .zeno-hero-art{position:absolute;right:13px;bottom:15px;opacity:.95;margin:0}
 .hero .zeno-hero-art img{width:105px;border-radius:21px}
 .hero .buttons{display:flex;flex-wrap:wrap;gap:8px;max-width:220px}
 .hero .buttons .btn{min-height:42px;padding:9px 12px;font-size:13px}
 .grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}
 .hospital-list,.grid.two,.two-col{grid-template-columns:1fr}
 .metric-grid{gap:8px}.metric{padding:15px 9px;border-radius:14px}.metric strong{font-size:18px}.metric small{font-size:11px;line-height:1.35}.metric .micon{font-size:20px}
 .section-title h2,.sectionhead{font-size:20px}.section-title span{font-size:12px}
 .choice{padding:15px}.choice strong{font-size:15px}.choice p{font-size:12px}.choice .circle{width:45px;height:45px}
 .hospital{padding:18px}.hospital h3{font-size:18px}.hospital p,.hospital .tiny{font-size:13px}
 .hospital .actions{width:100%;justify-content:flex-end;margin-left:0}
 .hospital .hfooter{gap:9px}
 .dashboard-hero{padding:20px}.dashboard-hero h2{font-size:22px}.dashboard-hero p{font-size:13px}.zeno-hospital-icon{width:70px;height:70px}
 .mobilebar{min-height:76px;padding:8px 4px max(8px,env(safe-area-inset-bottom))}
 .mobilebar button{font-size:11.5px;gap:5px;min-width:0;line-height:1.2;padding:4px 1px}
 .mobilebar button .ico{font-size:24px}
 .btn{min-height:46px;font-size:14px}
 .btn.small{min-height:40px;font-size:13px}
 .top-right .pill{font-size:11px}
}
@media(max-width:380px){
 .hero .zeno-hero-art{display:block;opacity:.75}
 .hero .zeno-hero-art img{width:82px}
 .hero h2{font-size:28px}
 .hero p{max-width:205px}
 .metric strong{font-size:17px}
}

if(path==='/api/bookings'&&method==='POST'){item={...data,id:uid(),ownerId,status:'pending',hospitalNote:'',proposedAt:'',createdAt:now,updatedAt:now};d.bookings.unshift(item)}
else if(parts[1]==='bookings'&&parts[2]&&method==='PATCH'){item=d.bookings.find(b=>b.id===id);if(!item)throw Error('예약을 찾을 수 없습니다.');let ownerChange=data.side==='owner';if(ownerChange){if(item.ownerId!==ownerId)throw Error('접근 권한이 없습니다.');if(!(['suggested','pending','accepted'].includes(item.status)))throw Error('변경할 수 없는 상태입니다.');if(data.status==='confirmed'&&item.status!=='suggested')throw Error('확인할 시간 제안이 없습니다.');if(!['confirmed','cancelled'].includes(data.status))throw Error('허용되지 않는 변경입니다.');}
else{if(item.hospitalId!==state.activeHospital)throw Error('병원 정보가 일치하지 않습니다.');const allowed={pending:['accepted','suggested','rejected'],accepted:['confirmed','rejected','suggested'],suggested:['rejected','suggested'],confirmed:['in_progress','done'],in_progress:['done'],done:[]};if(!allowed[item.status]?.includes(data.status))throw Error('허용되지 않는 상태 변경입니다.');}Object.assign(item,{status:data.status,proposedAt:data.proposedAt||item.proposedAt,hospitalNote:data.hospitalNote??item.hospitalNote,updatedAt:now})}
else if(path==='/api/settings'&&method==='PATCH'){let h=state.activeHospital;d.settings[h]={...d.settings[h],...data,updatedAt:now};item=d.settings[h]}
else if(path==='/api/questions'&&method==='POST'){item={...data,id:uid(),ownerId,status:'pending',answer:'',createdAt:now,updatedAt:now};d.questions.unshift(item)}
else if(parts[1]==='questions'&&parts[2]&&method==='PATCH'){item=d.questions.find(q=>q.id===id);if(!item||item.hospitalId!==state.activeHospital)throw Error('질문을 찾을 수 없습니다.');item.answer=data.answer;item.status='answered';item.updatedAt=now}
else if(path==='/api/reviews'&&method==='POST'){let b=d.bookings.find(x=>x.id===data.bookingId&&x.ownerId===ownerId&&x.status==='done');if(!b)throw Error('완료된 진료 예약에만 후기를 남길 수 있습니다.');if(d.reviews.some(x=>x.bookingId===b.id))throw Error('이미 후기를 작성했습니다.');item={...data,id:uid(),ownerId,hospitalId:b.hospitalId,points:100,createdAt:now};d.reviews.unshift(item)}
else throw Error('지원되지 않는 요청입니다.');localSet(d);return item||{ok:true}}

 const r=await fetch(path,{method,credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:method==='GET'?undefined:JSON.stringify(data||{})});

function emergency(){let list=HOSPITALS.filter(h=>h.is24);return `${topbar('24시간 · 응급 진료 찾기','진료 필요 시 병원에 전화해 수용 여부를 최종 확인하세요.')}<div class="hero" style="min-height:185px;padding:30px"><div><div class="eyebrow">URGENT CARE</div><h2 style="font-size:27px">응급일수록,<br><em>먼저 전화로 확인하세요.</em></h2><p>24시간 운영 안내와 실제 응급 수용 가능 여부는 다를 수 있습니다.</p></div><div class="hero-graphic" style="font-size:55px">📞</div></div><div class="section"><div class="section-title"><h2>24시간 운영 안내 병원</h2><span>${list.length}곳</span></div>${hospitalResults(list)}</div><div class="banner warning">주의: 아래 상태 표시의 '수용 가능'은 <strong>시연용 병원 관리자가 입력한 값</strong>입니다. 실제 동물병원의 진료 가능 여부를 나타내지 않습니다. 병원 방문 전 반드시 실제 전화로 확인하세요.</div><div class="section"><button class="btn secondary full" data-nav="search">청주 전체 병원 보기</button></div>`}
function petsPage(){let cards=state.pets.map(p=>`<div class="panel pet-card"><div class="petavatar">${p.species==='고양이'?'🐱':p.species==='강아지'?'🐶':'🐾'}</div><div class="details"><h3>${e(p.name)}</h3><p>${e(p.species)} · ${e(p.age||'나이 미입력')} · ${e(p.weight||'체중 미입력')}</p></div><button class="btn secondary small" data-action="record" data-id="${e(p.id)}">기록 추가</button><button class="btn ghost small" data-action="delete-pet" data-id="${e(p.id)}">×</button></div>`).join('');return `${topbar('내 아이 건강 기록','예방접종부터 검진 결과, 단골병원까지 한눈에')}<div class="banner">기록은 이 기기의 브라우저에만 저장됩니다. 병원 진료기록과 자동 연동되거나 의료기관에 공유되지 않습니다.</div><div class="section"><div class="section-title"><h2>등록한 아이 <span class="countdot">${state.pets.length}</span></h2><button class="btn small" data-action="add-pet">+ 아이 등록</button></div><div class="grid two">${cards||'<div class="empty"><span class="big">🐾</span>아이를 먼저 등록해 주세요.</div>'}</div></div><div class="section"><div class="section-title"><h2>예방접종 · 건강검진 기록</h2></div><div class="panel">${state.records.length?state.records.slice().reverse().map(r=>{let p=state.pets.find(x=>x.id===r.petId);return `<div class="row-line"><div><strong>${e(r.kind)} · ${e(p?.name||'삭제된 아이')}</strong><div class="sub">${e(r.date)} · ${e(r.memo||'메모 없음')}</div></div><button class="btn ghost small" data-action="delete-record" data-id="${e(r.id)}">삭제</button></div>`}).join(''):'<div class="empty">등록된 건강 기록이 없습니다.</div>'}</div></div><div class="section"><div class="section-title"><h2>단골 병원</h2></div>${hospitalResults(HOSPITALS.filter(x=>state.favorites.includes(x.id)))}</div>`}
function bookingCard(b,hospital=false){let h=hospitalById(b.hospitalId),step={pending:1,accepted:2,suggested:2,confirmed:3,in_progress:3,done:4,cancelled:1,rejected:1}[b.status]||1;return `<article class="booking-card"><div class="head"><div><h3>${hospital?e(b.petName):e(h?.name||'병원 정보 없음')}</h3><p>${hospital?e(b.petName)+' · '+e(b.species):e(b.petName)+' · '+e(b.species)} / ${e(b.service)}</p></div><span class="status ${b.status==='confirmed'?'available':b.status==='pending'?'busy':''}">${e(STATUS[b.status]||b.status)}</span></div><div class="booking-steps">${[1,2,3,4].map(n=>`<div class="${n<=step?'done':''}"></div>`).join('')}</div><p><strong>희망일:</strong> ${e(b.date)} ${e(b.time)} ${b.proposedAt?`<br><strong>병원 제안:</strong> ${e(b.proposedAt.replace('T',' '))}`:''}</p>${b.note?`<p>증상·요청: ${e(b.note)}</p>`:''}${b.hospitalNote?`<p style="background:#edf7ff;border-radius:8px;padding:9px"><strong>병원 메모:</strong> ${e(b.hospitalNote)}</p>`:''}<div class="buttons">${hospital?hospitalBookingButtons(b):ownerBookingButtons(b)}</div><p class="tiny">접수 ${dateTime(b.createdAt)} · 마지막 변경 ${dateTime(b.updatedAt)}</p></article>`}
function ownerBookingButtons(b){let s=b.status;return `${s==='suggested'?`<button class="btn small teal" data-action="owner-confirm" data-id="${e(b.id)}">제안 시간 확정</button>`:''}${['pending','accepted','suggested'].includes(s)?`<button class="btn secondary small" data-action="owner-cancel" data-id="${e(b.id)}">요청 취소</button>`:''}${s==='done'&&!state.reviews.some(x=>x.bookingId===b.id)?`<button class="btn small" data-action="review" data-id="${e(b.id)}">방문 인증 후기 작성</button>`:''}${s==='done'&&state.reviews.some(x=>x.bookingId===b.id)?'<span class="tag teal">후기 작성 완료 · 100P 적립</span>':''}${s==='confirmed'?'<span class="tag teal">병원 데모 예약 확정</span>':''}`}

function qaPage(){return `${topbar('동물병원 질문 · 답변','증상 사진 대신 질문 내용을 입력하고 병원 데모 답변을 받아보세요.')}<div class="banner warning">PPT의 ‘자격 확인된 수의사’ 기능을 목표로 합니다. <strong>현재 의료진 자격 검증·실제 의료 상담·사진 첨부는 연결되지 않았습니다.</strong> 답변은 데모 병원용 계정에서 입력한 시연 내용입니다. 응급 증상은 즉시 병원에 전화하세요.</div><div class="section"><div class="section-title"><h2>질문 보내기</h2><button class="btn small" data-action="ask">+ 새 질문</button></div><div class="grid two">${state.questions.map(q=>`<div class="panel"><span class="status ${q.status==='answered'?'available':'busy'}">${q.status==='answered'?'답변 등록':'답변 대기'}</span><h3 style="margin-top:10px">${e(hospitalById(q.hospitalId)?.name||'')}</h3><p class="desc">${e(q.petName||'반려동물')} · ${dateTime(q.createdAt)}</p><p class="preline">${e(q.text)}</p><div class="divider"></div><strong>병원 데모 답변</strong><p class="desc preline">${e(q.answer||'아직 답변이 등록되지 않았습니다.')}</p></div>`).join('')||'<div class="empty"><span class="big">💬</span>아직 질문이 없습니다.</div>'}</div></div>`}

function hospitalPage(){if(!state.hospitalToken)return hospitalLogin();let h=hospitalById(state.activeHospital),s=hs(h.id),b=state.hospitalBookings,q=state.hospitalQuestions;let outstanding=b.filter(x=>['pending','accepted','suggested'].includes(x.status)).length;return `${topbar('제노 병원 운영 대시보드','보호자 요청 · 상태 갱신 · 병원 정보 관리')}<div class="dashboard-hero"><div><span class="eyebrow" style="color:#9ed6ff">HOSPITAL OPERATIONS</span><h2>${e(h.name)}</h2><p>마지막 갱신 ${e(updateText(s.updatedAt))} · 병원 참여 확인 전 시연용</p></div><button class="btn secondary small" data-action="hospital-logout">병원 전환</button></div><div class="metric-grid"><div class="metric"><span class="micon">📋</span><strong>${b.length}건</strong><small>총 예약 요청</small></div><div class="metric"><span class="micon">🕒</span><strong>${outstanding}건</strong><small>확인·확정 대기</small></div><div class="metric"><span class="micon">💬</span><strong>${q.filter(x=>x.status!=='answered').length}건</strong><small>미답변 질문</small></div></div><div class="tabs">${[['bookings','예약 관리'],['status','진료 상태'],['questions','문의 답변'],['info','병원 정보']].map(x=>`<button data-action="h-tab" data-value="${x[0]}" class="${state.hTab===x[0]?'active':''}">${x[1]}</button>`).join('')}</div>${state.hTab==='bookings'?`<div class="section-title"><h2>오늘의 예약 · 문의</h2><span>수락 · 제안 · 거절 · 완료</span></div><div class="grid two">${b.map(x=>bookingCard(x,true)).join('')||'<div class="empty">새로운 예약 요청이 없습니다.<p>보호자용 화면에서 예약을 요청하면 여기에 나타납니다.</p></div>'}</div>`:''}${state.hTab==='status'?`<div class="two-col"><div class="panel"><h3>원탭 진료 수용 상태</h3><p class="desc">수용 상태를 변경하면 보호자용 병원 목록에 반영됩니다.</p><div class="radio-row" style="margin:16px 0">${[['available','수용 가능'],['busy','혼잡'],['check','확인 필요']].map(x=>`<button class="btn ${s.status===x[0]?'':'secondary'}" data-action="change-status" data-value="${x[0]}">${x[1]}</button>`).join('')}</div><form id="status-settings"><div class="field"><label>병원 운영 공지</label><textarea name="notice" maxlength="250" placeholder="예: 현재 야간 인력이 제한되어 있습니다.">${e(s.notice||'')}</textarea></div><label class="radio-row" style="margin-bottom:14px"><input type="checkbox" name="emergency" ${s.emergency?'checked':''}>응급 환자 전화 문의 안내 사용 (시연 표시)</label><button class="btn" type="submit">운영 정보 저장</button></form></div><div class="panel"><h3>보호자 화면 미리보기</h3><div style="margin-top:14px">${statusWidget(h)}</div><p class="desc">업데이트 ${updateText(s.updatedAt)}</p><p class="desc">${e(s.notice||'병원 공지가 없습니다.')}</p><div class="banner warning">실제 병원 운영 상태로 오인되지 않도록 시연용 문구가 표시됩니다.</div></div></div>`:''}${state.hTab==='questions'?`<div class="grid two">${q.map(x=>`<div class="panel"><span class="status ${x.status==='answered'?'available':'busy'}">${x.status==='answered'?'답변 등록':'답변 대기'}</span><h3 style="margin-top:12px">${e(x.petName||'반려동물')}의 질문</h3><p class="preline">${e(x.text)}</p><p class="desc">작성 ${dateTime(x.createdAt)}</p><div class="divider"></div><div class="field"><label>병원 시연 답변</label><textarea id="answer-${e(x.id)}" maxlength="1200" placeholder="진료 판단이 아닌 시연 답변을 입력하세요">${e(x.answer||'')}</textarea></div><button class="btn small" data-action="answer" data-id="${e(x.id)}">답변 저장</button></div>`).join('')||'<div class="empty">등록된 질문이 없습니다.</div>'}</div>`:''}${state.hTab==='info'?`<div class="grid two"><div class="panel"><h3>병원 기본 정보</h3><p>${e(h.address)}</p><p class="desc">${e(h.phone||'공개 연락처 미확인')}</p><p class="desc">${e(h.hours)}</p><div class="banner">공개자료 기반 기본 정보입니다. 실제 병원 확인 전에는 수정된 내용을 검증된 정보로 표시하지 않습니다.</div><div class="divider"></div><h3>진료과·진료 동물 등록 (시연)</h3><form id="hospital-service"><div class="field"><label>추가 진료 항목</label><select name="service">${['내과','안과','외과','흉부외과','피부과','토끼','햄스터','조류','파충류'].map(x=>`<option>${x}</option>`).join('')}</select></div><button class="btn small" type="submit">시연 진료 항목 추가</button></form><div class="tags" style="margin-top:12px">${(s.services||[]).map(x=>`<button class="tag blue" data-action="service-remove" data-value="${e(x)}">${e(x)} ×</button>`).join('')}</div></div><div class="panel"><h3>진료비 · 안내 (데모)</h3><p class="desc">정찰제·가격비교 기능 시연용입니다. 실제 진료비는 병원별로 확인이 필요합니다.</p><form id="hospital-prices"><div class="field"><label>공개 안내할 진료비 항목</label><input name="priceLabel" placeholder="예: 기본 진찰료 (시연용)" maxlength="55"></div><div class="field"><label>예시 가격(원)</label><input name="priceAmount" inputmode="numeric" pattern="[0-9]+" placeholder="예: 25000"></div><button type="submit" class="btn small">가격 항목 추가</button></form>${(s.prices||[]).map((p,i)=>`<div class="row-line"><div><strong>${e(p.label)} · ${Number(p.amount).toLocaleString('ko-KR')}원</strong><div class="sub">시연용 · 실제 요금 아님</div></div><button class="btn ghost small" data-action="price-remove" data-id="${i}">삭제</button></div>`).join('')}</div></div>`:''}<div class="footer">© ZENO · 이 화면은 병원에 실제 도입되지 않은 연결형 기능 시연용입니다.</div>`}
function adminPage(){if(!state.adminToken)return `${topbar('제노 관리자용','플랫폼 운영 현황 · 시연 관리자')}<div class="panel" style="max-width:510px;margin:20px auto"><h3>관리자 로그인</h3><form id="admin-login"><div class="field"><label>관리자 비밀번호</label><input name="pin" type="password" required></div><button class="btn full" type="submit">운영 현황 열기</button></form>${state.local?'<p class="notice">로컬 체험 관리자 비밀번호: 0000</p>':''}</div>`;let a=state.adminStats||{bookings:0,questions:0,confirmed:0,hospitals:3};return `${topbar('제노 운영 현황','3개 병원 연동 체험 데이터에 대한 집계')}<div class="dashboard-hero"><div><span class="eyebrow" style="color:#9ed6ff">ZENO ADMIN</span><h2>청주 파일럿 운영 화면</h2><p>병원 참여 → 실제 이용 → 재이용 검증</p></div><button class="btn secondary small" data-action="admin-logout">로그아웃</button></div><div class="metric-grid"><div class="metric"><span class="micon">🏥</span><strong>${a.hospitals}</strong><small>연동 구성 병원</small></div><div class="metric"><span class="micon">📅</span><strong>${a.bookings}</strong><small>데모 예약 수</small></div><div class="metric"><span class="micon">💬</span><strong>${a.questions}</strong><small>데모 질문 수</small></div></div><div class="section"><div class="panel"><h3>서비스 운영 체크리스트</h3>${[['병원 참여','시연 병원 3곳 구성'],['실제 이용','보호자 예약·병원 수락 흐름 테스트'],['재이용 검증','예약 후 기록·질문·혜택 이용 지표 측정']].map((x,i)=>`<div class="row-line"><div><strong>0${i+1} ${x[0]}</strong><div class="sub">${x[1]}</div></div><span class="tag blue">MVP</span></div>`).join('')}</div></div><div class="banner warning">이 수치는 현재 데모 데이터 집계이며 실제 병원 실적이나 정식 서비스 이용자가 아닙니다.</div>`}
function pricesPage(){const rows=HOSPITALS.flatMap(h=>(hs(h.id).prices||[]).map(p=>({...p,hospital:h.name,hospitalId:h.id})));return `${topbar('진료비 비교 시연','병원이 직접 입력한 예시 항목만 표시됩니다.')}<div class="banner warning">정찰제와 가격 비교의 작동 방식을 보여주는 시연입니다. <strong>아래 값은 실제 병원 진료비가 아닙니다.</strong> 항목별 검사 내용·중증도·추가 비용을 반드시 확인해야 합니다.</div><div class="section"><div class="section-title"><h2>등록된 데모 가격 <span class="countdot">${rows.length}건</span></h2></div>${rows.length?`<div class="panel">${rows.sort((a,b)=>a.amount-b.amount).map(r=>`<div class="row-line"><div><strong>${e(r.label)}</strong><div class="sub">${e(r.hospital)} · 시연 등록</div></div><strong>${Number(r.amount).toLocaleString()}원</strong></div>`).join('')}</div>`:`<div class="empty"><span class="big">💰</span>아직 입력된 진료비 예시가 없습니다.<p>병원용 → 병원 정보에서 예시 가격을 입력하면 비교 화면에 나타납니다.</p></div>`}</div>`}
function morePage(){return `${topbar('제노 전체 서비스','보호자용 · 동물병원용 · 관리자용')}<div class="panel" style="margin-bottom:16px;background:#eef7ff"><h3>🌈 우리 아이 추모관</h3><p>보호자가 원할 때만 추억을 기록합니다. 기존 진료 기록은 그대로 유지됩니다.</p><button type="button" class="btn" onclick="document.getElementById('memopen').click()">추모관 열기</button></div><div class="grid two">${[['emergency','📞','24시간·응급 진료','24시간 운영 안내 병원 검색'],['qa','💬','병원 질문·답변','병원 데모 계정에 질문 보내기'],['membership','💎','제노 멤버십·포인트','멤버십과 후기 포인트 계산'],['prices','💵','진료비 비교 시연','병원이 입력한 데모 가격 비교'],['search','🔎','병원·전문 진료 검색','청주 등록 병원 정보']] .map(x=>`<button class="choice" data-nav="${x[0]}"><div class="circle">${x[1]}</div><strong>${x[2]}</strong><p>${x[3]}</p></button>`).join('')}</div>`}

ch/${encodeURIComponent(h.name+' '+h.address)}" target="_blank" rel="noopener">지도 길찾기 ↗</a>${h.phone?`<a class="btn teal" href="tel:${e(h.phone)}">전화 연결</a>`:''}${h.linked?`<button class="btn" data-action="book" data-id="${h.id}">데모 예약 요청</button>`:''}</div>`;wide=true}

  state.local=!x.connected;state.serverReady=!!x.connected;
 }catch{state.local=true;state.serverReady=false}
 if(!state.serverReady){state.appError='서버와 데이터베이스 연결을 먼저 완료해야 합니다.';state.ownerToken='';render();return}
 if(APP_MODE==='owner'&&state.ownerToken){
  try{const x=await api('GET','/api/auth/me');state.owner=x.owner;ownerId=x.owner.id}
  catch{state.ownerToken='';state.owner=null;localStorage.removeItem('zeno-owner-auth')}
 }
 await refresh();
 setInterval(()=>{if(!document.hidden&&state.serverReady&&(APP_MODE==='hospital'||state.ownerToken))refresh()},12000);
 if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
render();start();
</script><style>#memopen{position:fixed;bottom:16px;right:16px;z-index:100;border:0;border-radius:25px;background:#1979e6;color:white;padding:14px;font-weight:bold}#membg{display:none;position:fixed;inset:0;background:#091b32b8;z-index:110;overflow:auto;padding:20px}#membg.show{display:block}#memcard{background:white;color:#173452;max-width:560px;margin:4vh auto;border-radius:20px;padding:24px}#memcard input:not([type=checkbox]),#memcard textarea,#memcard select{display:block;width:100%;box-sizing:border-box;margin:9px 0;padding:12px;border:1px solid #ccc;border-radius:8px}#memcard button{padding:10px 14px;background:#1979e6;color:white;border:0;border-radius:9px;margin:5px}@media(max-width:750px){#memopen{bottom:calc(88px + env(safe-area-inset-bottom));right:13px;padding:9px 15px;font-size:13px;box-shadow:0 7px 20px #1861bb38}}</style>
<button id="memopen" type="button">추모관</button><div id="membg" role="dialog" aria-modal="true"><div id="memcard"><button id="memclose" type="button">닫기</button><h2>우리 아이 추모관</h2><p>보호자가 원할 때만 추모 기록을 만듭니다. 기존 진료 기록과 병원 정보는 변경하지 않습니다.</p><select id="mempet"><option value="">반려동물 선택</option></select><input id="memtitle" maxlength="100" placeholder="추억의 제목"><textarea id="memtext" maxlength="3000" rows="5" placeholder="우리 아이에게 남기는 편지"></textarea><label><input id="memagree" type="checkbox"> 추모 기록 만들기에 동의합니다</label><div><button id="memsave" type="button">추억 저장</button></div><p style="font-size:12px">현재 브라우저에만 저장됩니다. 브라우저 데이터를 삭제하면 사라질 수 있습니다.</p><h3>저장한 추억</h3><div id="memlist"></div></div></div>
<script>(()=>{const $=x=>document.getElementById(x),key='zeno-memorial-v1',read=k=>{try{let a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch{return []}},esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderMem(){let pets=read('zeno-pets-v2');$('mempet').innerHTML='<option value="">반려동물 선택</option>'+pets.map((p,i)=>'<option value="'+i+'">'+esc(p.name||p.petName||'이름 미등록')+'</option>').join('');$('memlist').innerHTML=read(key).map(m=>'<div style="border-top:1px solid #ddd;padding:12px 0"><b>'+esc(m.pet)+' · '+esc(m.title)+'</b><p style="white-space:pre-wrap">'+esc(m.text)+'</p><button data-del="'+esc(m.id)+'">삭제</button></div>').join('')||'저장된 추억이 없습니다.'}$('memopen').onclick=()=>{$('membg').classList.add('show');renderMem()};$('memclose').onclick=()=>$('membg').classList.remove('show');$('memsave').onclick=()=>{let i=$('mempet').value,p=read('zeno-pets-v2')[Number(i)],title=$('memtitle').value.trim(),text=$('memtext').value.trim();if(i===''||!p)return alert('반려동물을 먼저 등록하고 선택해 주세요.');if(!$('memagree').checked)return alert('보호자 동의가 필요합니다.');if(!title||!text)return alert('제목과 추억을 입력해 주세요.');let a=read(key);a.push({id:String(Date.now()),pet:p.name||p.petName||'이름 미등록',title,text});try{localStorage.setItem(key,JSON.stringify(a));$('memtitle').value='';$('memtext').value='';$('memagree').checked=false;renderMem();alert('추모 기록이 저장되었습니다.')}catch{alert('브라우저 저장에 실패했습니다.')}};$('memlist').onclick=e=>{let b=e.target.closest('[data-del]');if(b&&confirm('이 추모 기록을 삭제할까요?')){localStorage.setItem(key,JSON.stringify(read(key).filter(x=>x.id!==b.dataset.del)));renderMem()}}})();</script></body></html>
