  if(force){await zenoRefreshTask;return refresh(false)}

  const before=zenoRefreshStamp(),page=state.page;
  const token=APP_MODE==='hospital'?state.hospitalToken:state.ownerToken;

    }
    state.profileLoaded=true;
   }
   if((APP_MODE==='hospital'?state.hospitalToken:state.ownerToken)!==token)return;
   zenoRefreshFailures=0;
   state.appError='';
   zenoRefreshPaint(before,page);
  }catch(err){

function zenoHomeBookingPreview(){

 const active=state.bookings.filter(b=>['pending','accepted','suggested','confirmed','in_progress'].includes(b.status));
 const priority=b=>b.status==='suggested'?0:1;
 const upcoming=active.filter(b=>b.status==='suggested'||b.status==='in_progress'||zenoVisitAt(b).slice(0,10)>=today())
  .sort((a,b)=>priority(a)-priority(b)||zenoVisitAt(a).localeCompare(zenoVisitAt(b)));
 const booking=upcoming[0];
 if(!booking)return '';
 const raw=zenoVisitAt(booking),[date,time='']=raw.trim().split(' ');
 const dateObj=new Date(date+'T00:00:00');
 const next=new Date(today()+'T00:00:00Z');next.setUTCDate(next.getUTCDate()+1);
 const tomorrow=next.toISOString().slice(0,10);
 const dateLabel=date===today()?'오늘':date===tomorrow?'내일':Number.isNaN(dateObj.getTime())?date:dateObj.toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
 const [hhText,mm='00']=time.split(':'),hh=Number(hhText);
 const timeLabel=Number.isInteger(hh)&&hh>=0&&hh<=23?(hh<12?'오전 ':'오후 ')+(hh%12||12)+':'+mm:time;
 const h=hospitalById(booking.hospitalId);
 return '<section class="zeno-home-booking"><span class="zeno-mini-label">내 예약</span><button type="button" data-nav="bookings"><strong>'+e(booking.petName||'반려동물')+' · '+e(dateLabel)+' '+e(timeLabel)+' · '+e(STATUS[booking.status]||booking.status)+'</strong><small>'+e(h?.name||'예약 병원 확인')+'</small></button></section>';
}

function zenoPriceCategory(label){
 const s=String(label||'').replace(/\s+/g,'').toLowerCase();
 if(/초진|첫진료|초진료/.test(s))return '초진 진찰료';
 if(/재진|재진료/.test(s))return '재진 진찰료';
 if(/건강검진|종합검진|검진/.test(s))return '건강검진';
 if(/예방접종|종합백신|접종|백신/.test(s))return '예방접종';
 if(/엑스레이|x-ray|xray|방사선/.test(s))return '엑스레이';
 if(/초음파/.test(s))return '초음파';
 if(/혈액검사|혈액/.test(s))return '혈액검사';
 return String(label||'기타');
}

if(a==='hospital-update'){let label=STATUS[el.dataset.status]||'변경';if(confirm('예약을 '+label+' 처리하시겠습니까?'))await mutate('PATCH','/api/bookings/'+id,{status:el.dataset.status,side:'hospital'},'예약 상태를 변경했습니다.');return}

if(id==='home-search-form'){state.query=val(d.homeQuery);state.specialty='';state.exoticSpecies='';state.filter='전체';state.activeFilters=[];zenoNewSearch=true;navTo('search');return}

if(id==='hospital-login'){try{let x=await api('POST','/api/login',{hospitalId:d.hospitalId,pin:d.pin});state.activeHospital=x.hospitalId;state.hospitalToken=x.token;sessionStorage.setItem('zeno-h-token',x.token);sessionStorage.setItem('zeno-h-hospital',x.hospitalId);state.hTab='bookings';await loadHospital();toast('병원 관리 화면으로 연결되었습니다.')}catch(err){toast(err.message)}return}
if(id==='admin-login'){try{let x=await api('POST','/api/admin/login',{pin:d.pin});state.adminToken=x.token;sessionStorage.setItem('zeno-admin-token',x.token);await loadAdmin();toast('관리자 화면으로 연결되었습니다.')}catch(err){toast(err.message)}return}
if(id==='booking-form'){
 if(state.bookingSubmitting)return;

 state.bookingSubmitting=true;
 if(button){button.disabled=true;button.textContent='예약 요청 보내는 중…'}
 try{
  await api('POST','/api/bookings',{hospitalId:d.hospitalId,petName:val(d.petName),species:d.species,date:d.date,time:d.time,service:d.service,note:val(d.note),ownerPhone:val(d.ownerPhone),breed:val(d.breed),age:val(d.age),weight:val(d.weight),visitType:val(d.visitType)});
  state.modal=null;await afterMutation('예약 요청을 보냈어요. 병원 확인을 기다려 주세요.');navTo('bookings');
 }catch(err){toast('요청하지 못했어요. 입력 내용을 유지했으니 다시 시도해 주세요. '+err.message)}
 finally{state.bookingSubmitting=false;if(button&&button.isConnected){button.disabled=false;button.textContent='예약 요청하기'}}
 return;
}
if(id==='question-form'){if(val(d.text).length<5){toast('질문을 5자 이상 작성해 주세요.');return}await mutate('POST','/api/questions',{hospitalId:d.hospitalId,petName:val(d.petName),text:val(d.text)},'병원용 데모 질문으로 등록되었습니다.');navTo('qa');return}
if(id==='memorial-note-form'){
 const pet=state.pets.find(p=>p.id===d.petId),mem=zenoMemorialGet();
 if(!pet||!mem.petIds.includes(pet.id)||!val(d.title)||!val(d.text)){toast('추모 내용을 확인해 주세요.');return}
 try{mem.notes.push({id:uid(),petId:pet.id,title:val(d.title),text:val(d.text),createdAt:new Date().toISOString()});zenoMemorialSet(mem);state.modal=null;render();toast('추억을 저장했어요.')}catch(err){toast(err.message)}
 return;
}
if(id==='pet-form'){state.pets.push({id:uid(),name:val(d.name),species:d.species,age:val(d.age),weight:val(d.weight)});savePersonal();state.modal=null;render();toast('우리 아이를 등록했습니다.');return}
if(id==='record-form'){state.records.push({id:uid(),petId:d.petId,kind:d.kind,date:d.date,memo:val(d.memo)});savePersonal();state.modal=null;render();toast('건강 기록을 저장했습니다.');return}
if(id==='propose-form'){if(d.proposedAt.slice(0,10)<today()){toast('지난 날짜를 제안할 수 없습니다.');return}await mutate('PATCH','/api/bookings/'+d.bookingId,{status:'suggested',side:'hospital',proposedAt:d.proposedAt,hospitalNote:val(d.hospitalNote)},'보호자에게 시간 변경을 제안했습니다.');return}
if(id==='status-settings'){await mutate('PATCH','/api/settings',{notice:val(d.notice),emergency:!!f.querySelector('[name=emergency]').checked},'병원 운영 안내를 저장했습니다.');return}
if(id==='hospital-service'){const services=[...new Set([...(hs(state.activeHospital).services||[]),val(d.service)])];await mutate('PATCH','/api/settings',{services},'진료 과목을 시연 설정에 추가했습니다.');return}
if(id==='hospital-prices'){let amount=Number(d.priceAmount);if(!Number.isFinite(amount)||amount<0||amount>1e7){toast('금액을 정확하게 입력해 주세요.');return}let s=hs(state.activeHospital),prices=[...(s.prices||[]),{label:val(d.priceLabel),amount}];await mutate('PATCH','/api/settings',{prices},'데모 가격 항목을 등록했습니다.');return}
if(id==='review-form'){if(val(d.text).length<10){toast('후기를 10자 이상 입력해 주세요.');return}await mutate('POST','/api/reviews',{bookingId:d.bookingId,stars:Number(d.stars),text:val(d.text)},'후기 등록 · 시연 포인트 100P가 적립되었습니다.');return}
});
window.addEventListener('storage',ev=>{if([STOREKEY,'zeno-pets-v2','zeno-records-v2','zeno-favorites-v2'].includes(ev.key)){state.pets=JSON.parse(localStorage.getItem('zeno-pets-v2')||'[]');state.records=JSON.parse(localStorage.getItem('zeno-records-v2')||'[]');state.favorites=JSON.parse(localStorage.getItem('zeno-favorites-v2')||'[]');refresh()}});
window.addEventListener('zeno-refresh',()=>{});
let zenoStarted=false,zenoStartPending=false,zenoStartRetry=null,zenoStartFailures=0,zenoPollTimer=null;
function zenoCanPoll(){return !document.hidden&&navigator.onLine!==false&&state.serverReady&&!!(APP_MODE==='hospital'?state.hospitalToken:state.ownerToken)}
function zenoPoll(){
 if(!zenoCanPoll())return;
 refresh().catch(err=>console.warn('ZENO background sync:',err));
}
async function start(){
 if(zenoStarted||zenoStartPending)return;
 zenoStartPending=true;
 try{
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),8000);
  let ready=false;
  try{
   const r=await fetch('/api/ping',{cache:'no-store',signal:controller.signal});
   if(r.ok){const x=await r.json();ready=!!x.connected}
  }catch(err){console.warn('ZENO connectivity:',err)}
  finally{clearTimeout(timeout)}
  state.local=!ready;state.serverReady=ready;
  if(!ready){
   state.appError='서버 연결을 재시도 중입니다.';
   render();
   zenoStartFailures++;
   const delay=Math.min(30000,5000*Math.pow(2,Math.min(zenoStartFailures-1,3)));
   if(!zenoStartRetry)zenoStartRetry=setTimeout(()=>{zenoStartRetry=null;start()},delay);
   return;
  }
  zenoStartFailures=0;
  state.appError='';
  if(APP_MODE==='owner'&&state.ownerToken){
   try{const x=await api('GET','/api/auth/me');state.owner=x.owner;ownerId=x.owner.id}
   catch(err){if(/인증|401|로그인/.test(err.message)){state.ownerToken='';state.owner=null;localStorage.removeItem('zeno-owner-auth')}}
  }
  await refresh();
  zenoStarted=true;
  if(!zenoPollTimer)zenoPollTimer=setInterval(zenoPoll,25000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)zenoPoll()});
  window.addEventListener('online',()=>{if(!state.serverReady){start()}else zenoPoll()});
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
 }finally{zenoStartPending=false}
}
render();start();

<button id="memopen" type="button">추모관</button><div id="membg" role="dialog" aria-modal="true"><div id="memcard"><button id="memclose" type="button">닫기</button><h2>우리 아이 추모관</h2><p>보호자가 원할 때만 추모 기록을 만듭니다. 기존 진료 기록과 병원 정보는 변경하지 않습니다.</p><select id="mempet"><option value="">반려동물 선택</option></select><input id="memtitle" maxlength="100" placeholder="추억의 제목"><textarea id="memtext" maxlength="3000" rows="5" placeholder="우리 아이에게 남기는 편지"></textarea><label><input id="memagree" type="checkbox"> 추모 기록 만들기에 동의합니다</label><div><button id="memsave" type="button">추억 저장</button></div><p style="font-size:12px">현재 브라우저에만 저장됩니다. 브라우저 데이터를 삭제하면 사라질 수 있습니다.</p><h3>저장한 추억</h3><div id="memlist"></div></div></div>
<script>(()=>{const $=x=>document.getElementById(x),key='zeno-memorial-v1',read=k=>{try{let a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch{return []}},esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderMem(){let pets=read('zeno-pets-v2');$('mempet').innerHTML='<option value="">반려동물 선택</option>'+pets.map((p,i)=>'<option value="'+i+'">'+esc(p.name||p.petName||'이름 미등록')+'</option>').join('');$('memlist').innerHTML=read(key).map(m=>'<div style="border-top:1px solid #ddd;padding:12px 0"><b>'+esc(m.pet)+' · '+esc(m.title)+'</b><p style="white-space:pre-wrap">'+esc(m.text)+'</p><button data-del="'+esc(m.id)+'">삭제</button></div>').join('')||'저장된 추억이 없습니다.'}$('memopen').onclick=()=>{$('membg').classList.add('show');renderMem()};$('memclose').onclick=()=>$('membg').classList.remove('show');$('memsave').onclick=()=>{let i=$('mempet').value,p=read('zeno-pets-v2')[Number(i)],title=$('memtitle').value.trim(),text=$('memtext').value.trim();if(i===''||!p)return alert('반려동물을 먼저 등록하고 선택해 주세요.');if(!$('memagree').checked)return alert('보호자 동의가 필요합니다.');if(!title||!text)return alert('제목과 추억을 입력해 주세요.');let a=read(key);a.push({id:String(Date.now()),pet:p.name||p.petName||'이름 미등록',title,text});try{localStorage.setItem(key,JSON.stringify(a));$('memtitle').value='';$('memtext').value='';$('memagree').checked=false;renderMem();alert('추모 기록이 저장되었습니다.')}catch{alert('브라우저 저장에 실패했습니다.')}};$('memlist').onclick=e=>{let b=e.target.closest('[data-del]');if(b&&confirm('이 추모 기록을 삭제할까요?')){localStorage.setItem(key,JSON.stringify(read(key).filter(x=>x.id!==b.dataset.del)));renderMem()}}})();</script></body></html>
