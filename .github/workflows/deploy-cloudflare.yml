name: Deploy ZENO to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "owner.html"
      - "hospital.html"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeno-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get current ZENO source
        uses: actions/checkout@v4

      - name: Check Cloudflare connection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f805a734c87c90e765d7e455a469a730"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare token was not found under CLOUDFLARE_API_TOKEN, CF_API_TOKEN, CLOUDFLARE_TOKEN, or CF_TOKEN. Connect a Cloudflare API token as repository secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Validate ZENO release JavaScript and embedded HTML
        run: |
          node --check worker.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const worker=fs.readFileSync('worker.js','utf8');
          for(const [name,constant] of [['owner.html','OWNER_HTML'],['hospital.html','HOSPITAL_HTML']]){
            const html=fs.readFileSync(name,'utf8');
            if(!worker.includes('const '+constant+' = '+JSON.stringify(html)+';'))throw Error(name+' is not synchronized with the deployed Worker');
            const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
            if(!scripts.length)throw Error(name+' has no inline JavaScript');
            for(const [i,code] of scripts.entries())new vm.Script(code,{filename:name+'#script'+i});
            if(name==='owner.html'){
              if(!html.includes('function zenoVisitAt(')||!html.includes('function zenoHomeBookingPreview('))throw Error('Home/booking helpers are missing');
              if(!html.includes('병원 확인 대기'))throw Error('Booking status copy is missing');
            }
          }
          NODE

      - name: Deploy existing Worker and D1 binding
        id: deploy
        run: |
          # Cloudflare may intermittently fail Worker version uploads (API 10013).
          # Retry the same compiled artifact, then retry with an earlier Wrangler release.
          for attempt in 1 2; do
            echo "Production deployment attempt $attempt using repository Wrangler"
            if npx wrangler deploy --config wrangler.toml; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then sleep 10; fi
          done
          echo "Trying the previous Wrangler release after two Cloudflare API failures"
          npx --yes wrangler@4.150.0 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f805a734c87c90e765d7e455a469a730"

      - name: Verify production public routes
        id: live_smoke
        run: |
          node --input-type=module <<'NODE'
          const fs = await import('node:fs');
          const workerSource=fs.readFileSync('worker.js','utf8');
          const expectedOwnerRevision=workerSource.match(/const OWNER_UI_REVISION\s*=\s*'([^']+)'/)?.[1];
          if(!expectedOwnerRevision)throw Error('Worker UI revision missing');
          const base='https://zeno.rlaehdus2477.workers.dev';
          async function get(path){
            const response=await fetch(base+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error(path+' returned HTTP '+response.status);
            return response;
          }
          const owner=await (await get('/owner?release=clinical-20261114')).text();
          for(const expected of ['ZENO','진료 분야로 찾기','진료 과목','예약 요청','24시 청주이음동물의료센터','종양 수술','영상의학','수술 후 재활']){if(!owner.includes(expected))throw Error('Production owner UI missing: '+expected);}
          const hospital=await (await get('/hospital?release=clinical-20261114')).text();
          for(const expected of ['예약','24시 청주이음동물의료센터','영상의학','종양 수술']){if(!hospital.includes(expected))throw Error('Production hospital UI missing: '+expected);}
          const revision=await (await get('/api/ui-version')).json();
          if(revision?.owner!==expectedOwnerRevision)throw Error('Owner UI version not deployed: '+JSON.stringify(revision)+' expected '+expectedOwnerRevision);
          if(!owner.includes("const ZENO_OWNER_UI_REVISION='"+expectedOwnerRevision+"'"))throw Error('Owner page revision not synchronized with Worker: '+expectedOwnerRevision);
          const json=await (await get('/api/public/hospital-status')).json();
          if(!json||typeof json.settings!=='object')throw Error('Public hospital status response invalid');
          console.log('ZENO production owner/hospital/public API smoke test PASS');
          NODE

      - name: Restore previous Cloudflare Worker after failed live check
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        run: npx wrangler rollback --name zeno --message "Auto rollback - ZENO production smoke check failed"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f805a734c87c90e765d7e455a469a730"
