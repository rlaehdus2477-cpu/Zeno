name: Deploy ZENO to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeno-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get current ZENO source
        uses: actions/checkout@v4

      - name: Check Cloudflare connection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f805a734c87c90e765d7e455a469a730"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare API token is not connected. Add GitHub Actions repository secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Deploy existing Worker and D1 binding
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f805a734c87c90e765d7e455a469a730"
