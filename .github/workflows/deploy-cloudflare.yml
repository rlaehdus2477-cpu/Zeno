name: Deploy ZENO to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "owner.html"
      - "hospital.html"
      - "manifest-hospital.webmanifest"
      - "assets/hospital-icon-approved.webp.b64"
      - "wrangler.toml"
      - "package.json"
      - "schema.sql"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeno-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get current ZENO source
        uses: actions/checkout@v4

      - name: Check Cloudflare connection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f805a734c87c90e765d7e455a469a730"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare token was not found under CLOUDFLARE_API_TOKEN, CF_API_TOKEN, CLOUDFLARE_TOKEN, or CF_TOKEN. Connect a Cloudflare API token as repository secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Render approved hospital PWA icons from selected image
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, io
          from pathlib import Path
          from PIL import Image
          b64 = Path('assets/hospital-icon-approved.webp.b64').read_text().strip()
          raw = base64.b64decode(b64, validate=True)
          img = Image.open(io.BytesIO(raw)).convert('RGBA')
          if img.size != (256, 256):
              raise ValueError('Unexpected approved hospital icon dimensions')
          for size in (192, 512):
              img.resize((size, size), Image.Resampling.LANCZOS).save(
                  f'/tmp/zeno-hospital-icon-{size}.png', optimize=True)
          PY

      - name: Synchronize current UI into embedded Cloudflare Worker
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let worker=fs.readFileSync('worker.js','utf8');
          const owner=fs.readFileSync('owner.html','utf8');
          const {createHash}=await import('node:crypto');
          const version='owner-'+createHash('sha256').update(owner).digest('hex').slice(0,16);
          const revisionLine=/const ZENO_OWNER_UI_REVISION\s*=\s*'[^']+';/;
          if(!revisionLine.test(owner))throw Error('Owner UI revision missing');
          fs.writeFileSync('owner.html',owner.replace(revisionLine,"const ZENO_OWNER_UI_REVISION='"+version+"';"));
          // Hospital page and Worker must report the same UI revision, or the
          // hospital page reloads itself forever.
          const hospitalSrc=fs.readFileSync('hospital.html','utf8');
          const hospitalVersion='hospital-'+createHash('sha256').update(hospitalSrc).digest('hex').slice(0,16);
          const hospitalLine=/const ZENO_HOSPITAL_UI_REVISION\s*=\s*'[^']+';/;
          if(!hospitalLine.test(hospitalSrc))throw Error('Hospital UI revision missing');
          fs.writeFileSync('hospital.html',hospitalSrc.replace(hospitalLine,"const ZENO_HOSPITAL_UI_REVISION='"+hospitalVersion+"';"));
          for(const [filename,constant] of [['owner.html','OWNER_HTML'],['hospital.html','HOSPITAL_HTML']]){
            const html=fs.readFileSync(filename,'utf8');
            const prefix='const '+constant+' = ';
            const offset=worker.indexOf(prefix);
            if(offset<0)throw Error('Worker missing embedded view '+constant);
            const start=offset+prefix.length;
            const match=worker.slice(start).match(/^"(?:\\.|[^"\\])*"/);
            if(!match)throw Error('Worker view '+constant+' is not a JSON string');
            worker=worker.slice(0,start)+JSON.stringify(html)+worker.slice(start+match[0].length);
            console.log('Embedded latest '+filename+' into Cloudflare Worker');
          }
          // Keep the installed Galaxy PWA icon and APK artwork in sync with the approved asset.
          function replaceEmbedded(name,value){
            const prefix='const '+name+' = ';
            const pos=worker.indexOf(prefix);
            if(pos<0)throw Error('Missing Worker icon/manifest constant: '+name);
            const start=pos+prefix.length;
            const match=worker.slice(start).match(/^"(?:\\.|[^"\\])*"/);
            if(!match)throw Error('Invalid Worker string constant: '+name);
            worker=worker.slice(0,start)+JSON.stringify(value)+worker.slice(start+match[0].length);
          }
          replaceEmbedded('HOSPITAL_MANIFEST',fs.readFileSync('manifest-hospital.webmanifest','utf8').trim());
          for(const size of [192,512]){
            replaceEmbedded('HOSPITAL_MINT_PNG'+size,fs.readFileSync('/tmp/zeno-hospital-icon-'+size+'.png').toString('base64'));
          }
          const oldIconRoute="if(path==='/icon-hospital-mint-512-v5.png')";
          if(!worker.includes(oldIconRoute))throw Error('Hospital icon route anchor missing');
          worker=worker.replace(oldIconRoute,
            "if(path==='/icon-hospital-mint-512-v6.png')return binary(HOSPITAL_MINT_PNG512,'image/png'); "+
            "if(path==='/icon-hospital-mint-192-v6.png')return binary(HOSPITAL_MINT_PNG192,'image/png'); "+oldIconRoute);
          const revision=/const OWNER_UI_REVISION\s*=\s*'[^']+';/;
          if(!revision.test(worker))throw Error('Worker UI revision constant missing');
          worker=worker.replace(revision,"const OWNER_UI_REVISION = '"+version+"';");
          const hospitalRevision=/const HOSPITAL_UI_REVISION\s*=\s*'[^']+';/;
          if(!hospitalRevision.test(worker))throw Error('Worker hospital UI revision constant missing');
          worker=worker.replace(hospitalRevision,"const HOSPITAL_UI_REVISION = '"+hospitalVersion+"';");
          // Existing 1.2 APK loads /owner?android_app=1.2: redirect it to a fresh
          // path not intercepted by older service workers which only controlled /owner.
          const ownerRoute="if(['/owner','/owner/','/owner.html'].includes(path))return new Response(OWNER_HTML";
          if(!worker.includes(ownerRoute))throw Error('Owner routing anchor missing');
          const legacyRedirect="if(['/owner','/owner/','/owner.html'].includes(path)&&new URL(request.url).searchParams.has('android_app')){const target=new URL(request.url);target.pathname='/owner-native';return new Response(null,{status:302,headers:{Location:target.toString(),'Cache-Control':'no-store, max-age=0'}});}\n";
          worker=worker.replace(ownerRoute,legacyRedirect+"if(['/owner','/owner/','/owner.html','/owner-compact','/owner-native'].includes(path))return new Response(OWNER_HTML");
          if(!worker.includes("if(['/owner','/owner/','/owner.html','/owner-compact','/owner-native'].includes(path))return new Response(OWNER_HTML"))throw Error('Native route missing from built Worker');
          fs.writeFileSync('worker.js',worker);
          console.log('Worker UI revision synchronized: '+version+' / '+hospitalVersion);
          NODE
      - name: Validate ZENO release JavaScript and embedded HTML
        run: |
          node --check worker.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const worker=fs.readFileSync('worker.js','utf8');
          for(const size of [192,512]){
            const iconName='/icon-hospital-mint-'+size+'-v6.png';
            if(!worker.includes(iconName))throw Error('Approved hospital icon route missing: '+iconName);
            const expected=fs.readFileSync('/tmp/zeno-hospital-icon-'+size+'.png').toString('base64');
            if(!worker.includes('const HOSPITAL_MINT_PNG'+size+' = '+JSON.stringify(expected)+';'))throw Error('Approved hospital icon payload mismatch: '+size);
          }
          if(!worker.includes('const HOSPITAL_MANIFEST = '+JSON.stringify(fs.readFileSync('manifest-hospital.webmanifest','utf8').trim())+';'))throw Error('Hospital manifest payload mismatch');
          for(const [name,constant] of [['owner.html','OWNER_HTML'],['hospital.html','HOSPITAL_HTML']]){
            const html=fs.readFileSync(name,'utf8');
            if(!worker.includes('const '+constant+' = '+JSON.stringify(html)+';'))throw Error(name+' is not synchronized with the deployed Worker');
            const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
            if(!scripts.length)throw Error(name+' has no inline JavaScript');
            for(const [i,code] of scripts.entries())new vm.Script(code,{filename:name+'#script'+i});
            if(name==='hospital.html'){
              const page=html.match(/const ZENO_HOSPITAL_UI_REVISION='([^']+)'/)?.[1];
              const served=worker.match(/const HOSPITAL_UI_REVISION\s*=\s*'([^']+)'/)?.[1];
              if(!page||page!==served)throw Error('Hospital UI revision mismatch (page '+page+' / worker '+served+'): hospital page would reload forever');
            }
            if(name==='owner.html'){
              if(!html.includes('function zenoVisitAt(')||!html.includes('function zenoHomeBookingPreview('))throw Error('Home/booking helpers are missing');
              if(!html.includes('병원 확인 대기'))throw Error('Booking status copy is missing');
            }
          }
          NODE

      - name: Booking flow tests (local D1 only, blocks deploy on failure)
        # Runs the built Worker with wrangler dev --local and fake test secrets.
        # No Cloudflare token is passed here, so this step cannot touch production.
        run: node tests/booking-flow.mjs
        env:
          NO_PROXY: "127.0.0.1,localhost"

      - name: ZENO PASS flow tests (local D1 only, blocks deploy on failure)
        run: node tests/pass-flow.mjs
        env:
          NO_PROXY: "127.0.0.1,localhost"

      - name: Inpatient and night care tests (local D1 only, blocks deploy on failure)
        run: node tests/inpatient-care-flow.mjs
        env:
          NO_PROXY: "127.0.0.1,localhost"

      - name: ZENO PASS nutrition calculation tests (blocks deploy on failure)
        run: node tests/pass-nutrition-unit.mjs

      - name: ZENO PASS public fee comparison tests (blocks deploy on failure)
        run: node tests/pass-fees-unit.mjs

      - name: Symptom hospital finder tests (blocks deploy on failure)
        run: node tests/symptom-finder-unit.mjs

      - name: Deploy existing Worker and D1 binding
        id: deploy
        run: |
          # The Worker health check requires the new partner's production login binding.
          secrets_json=$(npx wrangler secret list --config wrangler.toml --format json)
          if ! jq -e 'any(.[]; .name == "HOSPITAL_TPLUS_PIN")' <<< "$secrets_json" >/dev/null; then
            echo "::error::HOSPITAL_TPLUS_PIN is missing on the zeno Worker."
            exit 1
          fi
          # Cloudflare may intermittently fail Worker version uploads (API 10013).
          # Retry the same compiled artifact, then retry with an earlier Wrangler release.
          for attempt in 1 2; do
            echo "Production deployment attempt $attempt using repository Wrangler"
            if npx wrangler deploy --config wrangler.toml; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then sleep 10; fi
          done
          echo "Trying the previous Wrangler release after two Cloudflare API failures"
          npx --yes wrangler@4.150.0 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f805a734c87c90e765d7e455a469a730"

      - name: Verify production public routes
        id: live_smoke
        run: |
          node --input-type=module <<'NODE'
          const fs = await import('node:fs');
          const workerSource=fs.readFileSync('worker.js','utf8');
          const expectedOwnerRevision=workerSource.match(/const OWNER_UI_REVISION\s*=\s*'([^']+)'/)?.[1];
          if(!expectedOwnerRevision)throw Error('Worker UI revision missing');
          const reservationSnapshot=html=>{
            const start=html.indexOf('const HOSPITALS=');
            const end=html.indexOf('];',start);
            if(start<0||end<start)throw Error('Reservation snapshot: HOSPITALS missing');
            return JSON.stringify(JSON.parse(html.slice(start+'const HOSPITALS='.length,end+1)).map(h=>[h.id,h.reservationInfo||null,h.reservationUrl||null]));
          };
          const expectedReservationSnapshot=reservationSnapshot(fs.readFileSync('owner.html','utf8'));
          const base='https://zeno.rlaehdus2477.workers.dev';
          async function get(path){
            const response=await fetch(base+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error(path+' returned HTTP '+response.status);
            return response;
          }
          // Wait for the new Worker to reach the public edge. Never accept stale HTML.
          let checked=false, lastError;
          for(let attempt=1;attempt<=10;attempt++){
            try{
              const nonce=encodeURIComponent(expectedOwnerRevision)+'-'+attempt;
              const owner=await (await get('/owner?ui='+nonce)).text();
              for(const expected of ['ZENO','진료 분야로 찾기','특수동물','예약 요청','24시 청주이음동물의료센터','종양 수술','영상의학','수술 후 재활']){if(!owner.includes(expected))throw Error('Production owner UI missing: '+expected);}
              // Check the ordinary owner URL that installed apps open as well.
              for(const mobilePath of ['/owner-native?android_app=1.2','/owner-native?android_app=1.6','/owner','/owner?android_app=1.2','/owner?android_app=1.6','/owner?ui='+encodeURIComponent(expectedOwnerRevision)]){
                const mobileOwner=await (await get(mobilePath)).text();
              if(!mobileOwner.includes("const ZENO_OWNER_UI_REVISION='"+expectedOwnerRevision+"'") ||
                 !mobileOwner.includes('#app .zeno-search-page .zeno-search-card .zeno-card-actions') ||
                 !mobileOwner.includes('zenoListCareLine(h)+contextHtml') || !mobileOwner.includes('zenoListReservation(h,eligible)') || !mobileOwner.includes('zenoListHoursSort(rows)')){
                  throw Error(mobilePath+' still serves the previous hospital list');
                }
                if(reservationSnapshot(mobileOwner)!==expectedReservationSnapshot)throw Error(mobilePath+' reservation information differs from release data');
              }
              const redirect=await fetch(base+'/owner?android_app=1.2',{redirect:'manual',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
              if(redirect.status!==302||!redirect.headers.get('location')?.includes('/owner-native?android_app=1.2'))throw Error('Legacy 1.2 APK route does not redirect outside old service worker paths');
              const native16=await fetch(base+'/owner?android_app=1.6',{redirect:'manual',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
              if(native16.status!==302||!native16.headers.get('location')?.includes('/owner-native?android_app=1.6')||!native16.headers.get('cache-control')?.includes('no-store'))throw Error('Installed 1.6 APK route is not redirected to a fresh native page');
              // Check the exact hospital record delivered to installed Galaxy PWAs, not just the UI revision.
              const dugeunStart=owner.indexOf('{"id":"pub008"');
              const dugeunEnd=owner.indexOf('},{"id":"pub009"',dugeunStart);
              if(dugeunStart<0||dugeunEnd<=dugeunStart)throw Error('Production owner UI missing Dugeun hospital record');
              const dugeun=owner.slice(dugeunStart,dugeunEnd);
              for(const required of ['"careFields":["내과","피부과","안과","치과","예방의학과","영상의학과","외과","비뇨기과","정형외과","이비인후과","산과"]','"officialCompanionSpecies":["개","고양이"]']){
                if(!dugeun.includes(required))throw Error('Production owner Dugeun NAVER profile incomplete: '+required);
              }
              if(!dugeun.includes('"name":"두근동물병원"')||!dugeun.includes('"declaredSpecialties":["심장"]'))throw Error('Dugeun cardiac specialty is not published in production owner UI');
              // Verify the 17 registered cat waiting rooms in both public applications.
              for(const [view,html] of [['owner',owner],['hospital',await (await get('/hospital?ui='+nonce)).text()]]){
                const start=html.indexOf('const HOSPITALS=');
                const end=html.indexOf('];',start);
                if(start<0||end<start)throw Error(view+' HOSPITALS data missing');
                const records=JSON.parse(html.slice(start+'const HOSPITALS='.length,end+1));
                const partners=records.filter(h=>h.linked).map(h=>h.id).sort().join(',');
                if(partners!=='naeum,pub045,soo'||!records.some(h=>h.id==='tnd'&&h.linked===false))throw Error(view+' pilot partner list mismatch: '+partners);
                const waiting=records.filter(h=>h.catWaiting);
                if(waiting.length!==17)throw Error(view+' cat waiting room records count '+waiting.length+' (expected 17)');
                const may=waiting.find(h=>h.id==='pub029');
                const narae=waiting.find(h=>h.id==='pub028');
                if(!may?.catWaiting?.naverVerified||!narae?.catWaiting?.verified)throw Error(view+' cat waiting record missing');
                const unverified=waiting.filter(h=>h.catWaiting.verificationStatus==='needs-naver-check');
                const tnd=waiting.find(h=>h.id==='tnd');
                if(!tnd?.catWaiting?.naverVerified||!tnd?.catWaiting?.separate)throw Error(view+' T&D NAVER cat waiting-room confirmation is missing');
                if(unverified.length!==0)throw Error(view+' cat waiting rooms still marked pending '+unverified.length);
                if(html.includes('보호자 제보'))throw Error(view+' old guardian-report wording has returned');
              }
              const sw=await (await get('/sw.js?ui='+nonce)).text();
              if(!sw.includes("url.pathname.startsWith('/api/')")||!sw.includes("fetch(request,{cache:'no-store'})"))throw Error('PWA refresh rules are missing for installed Galaxy apps');
              // Never mark Galaxy production as updated while a guardian-report label remains.
              if(owner.includes('제보'))throw Error('Guardian-report labels remain on live Galaxy owner app');
              const hospital=await (await get('/hospital?ui='+nonce)).text();
              for(const expected of ['예약','24시 청주이음동물의료센터','영상의학','종양 수술']){if(!hospital.includes(expected))throw Error('Production hospital UI missing: '+expected);}
              if(hospital.includes('제보'))throw Error('Guardian-report labels remain on live hospital app');
              // Verify both views contain the same complete Koryo and Daom records.
              for(const [id,name,expected] of [
                ['pub038','고려동물메디컬센터','"declaredSpecialties":["암센터"]'],
                ['pub016','24시청주다옴동물의료센터','"careVerificationStatus":"needs-naver-check"']
              ]){
                for(const [view,html] of [['owner',owner],['hospital',hospital]]){
                  const start=html.indexOf('{"id":"'+id+'"');
                  const end=html.indexOf('},{"id":"',start+12);
                  if(start<0||end<=start)throw Error(view+' missing hospital '+name);
                  const record=html.slice(start,end);
                  if(!record.includes('"name":"'+name+'"')||!record.includes(expected)||!record.includes('"careFields":'))throw Error(view+' incomplete clinic profile '+name);
                }
              }
              // ZENO PASS (2026-11-26): UI 모듈이 실제로 배포되고, PASS·영수증·병원 처방식 API가 로그인 없이 열리지 않는지 확인
              if(!owner.includes('id="zeno-pass-module"')||!owner.includes("state.page==='pass'?zenoPassPage()"))throw Error('ZENO PASS owner module missing in production');
              if(!hospital.includes('function zpHospitalRxSection(')||!hospital.includes("['rx','pill','처방식']"))throw Error('Hospital prescription-diet tab missing in production');
              for(const p of ['/api/pass','/api/pass/rx-stock','/api/pass/fee-plan','/api/pass/nutrition','/api/receipts','/api/receipts/export','/api/hospital/rx']){
                const r=await fetch(base+p,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
                if(r.status!==401)throw Error('ZENO PASS route '+p+' must require login but returned HTTP '+r.status);
              }
              // 입원·야간 관리 (2026-11-27): 보호자 필터·상세, 병원 입력 화면, 공개 API, 병원 저장 권한 확인
              if(!owner.includes('function zenoCareDetail(')||!owner.includes('ZENO_CARE_FILTERS.map(chip)'))throw Error('Inpatient/night care owner UI missing in production');
              if(!hospital.includes('function hiCareSettings('))throw Error('Inpatient/night care hospital form missing in production');
              const care=await (await get('/api/public/hospital-care?ui='+nonce)).json();
              if(!care||typeof care.hospitals!=='object')throw Error('Public hospital care response invalid');
              const careWrite=await fetch(base+'/api/hospital-care',{method:'PUT',headers:{'content-type':'application/json','Cache-Control':'no-cache'},body:'{}',signal:AbortSignal.timeout(20000)});
              if(careWrite.status!==401)throw Error('Hospital care save must require hospital login but returned HTTP '+careWrite.status);
              // 수동물병원 (2026-11-27 수의사 인터뷰): 제휴 유지, ZENO 신규 온라인 예약은 서버에서 409로 차단
              const sooRecord=JSON.parse(owner.slice(owner.indexOf('const HOSPITALS=')+'const HOSPITALS='.length,owner.indexOf('];',owner.indexOf('const HOSPITALS='))+1)).find(h=>h.id==='soo');
              if(!sooRecord?.linked||sooRecord.onlineBookingEnabled!==false||sooRecord.bookingPolicy?.firstVisit!=='walk-in'||sooRecord.bookingPolicy?.followUp!=='phone-only')throw Error('Soo booking policy not published in production owner UI');
              const sooBooking=await fetch(base+'/api/bookings',{method:'POST',headers:{'content-type':'application/json','Cache-Control':'no-cache'},body:JSON.stringify({hospitalId:'soo'}),signal:AbortSignal.timeout(20000)});
              const sooBody=await sooBooking.json().catch(()=>({}));
              if(sooBooking.status!==409||sooBody.code!=='ONLINE_BOOKING_UNAVAILABLE')throw Error('Soo online booking must be blocked with 409 but returned HTTP '+sooBooking.status+' '+JSON.stringify(sooBody));
              const naeumBooking=await fetch(base+'/api/bookings',{method:'POST',headers:{'content-type':'application/json','Cache-Control':'no-cache'},body:JSON.stringify({hospitalId:'naeum'}),signal:AbortSignal.timeout(20000)});
              if(naeumBooking.status!==401)throw Error('Other partner booking must still reach owner login check (401) but returned HTTP '+naeumBooking.status);
              const revision=await (await get('/api/ui-version?ui='+nonce)).json();
              if(revision?.owner!==expectedOwnerRevision)throw Error('Owner UI version not deployed: '+JSON.stringify(revision)+' expected '+expectedOwnerRevision);
              if(!owner.includes("const ZENO_OWNER_UI_REVISION='"+expectedOwnerRevision+"'"))throw Error('Owner page revision not synchronized with Worker: '+expectedOwnerRevision);
              const ping=await (await get('/api/ping?ui='+nonce)).json();
              if(ping.connected!==true)throw Error('Production Worker connection check failed');
              const json=await (await get('/api/public/hospital-status?ui='+nonce)).json();
              if(!json||typeof json.settings!=='object')throw Error('Public hospital status response invalid');
              checked=true;break;
            }catch(error){
              lastError=error;
              console.warn('Production verification attempt '+attempt+': '+error.message);
              if(attempt<10)await new Promise(resolve=>setTimeout(resolve,4000));
            }
          }
          if(!checked)throw lastError;
          console.log('ZENO production owner/hospital/public API smoke test PASS');
          NODE

      - name: Restore previous Cloudflare Worker after failed live check
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        run: npx wrangler rollback --name zeno --message "Auto rollback - ZENO production smoke check failed"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f805a734c87c90e765d7e455a469a730"
