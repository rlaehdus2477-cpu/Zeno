name: Build ZENO Owner Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/owner/**"
      - ".github/workflows/build-android-owner.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeno-owner-android-apk-v1-4
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ZENO
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 35 and build tools
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Generate temporary test signing key
        shell: bash
        run: |
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          echo "ZENO_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          echo "ZENO_KEYSTORE=$RUNNER_TEMP/zeno-owner-test.p12" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/zeno-owner-test.p12" \
            -storepass "$PASS" -keypass "$PASS" \
            -alias owner -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=ZENO Owner Test, OU=Development, O=ZENO, C=KR"

      - name: Compile and sign Android APK
        shell: bash
        run: |
          bash android/owner/build.sh "$GITHUB_WORKSPACE/ZENO-Owner-1.4.apk"
          ls -lh ZENO-Owner-1.4.apk
          "$BUILD_TOOLS/aapt" dump badging ZENO-Owner-1.4.apk | head -15

      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZENO-Owner-1.4-Android-APK
          path: ZENO-Owner-1.4.apk
          if-no-files-found: error

      - name: Create public test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view owner-android-v1.4 >/dev/null 2>&1; then
            echo "A v1.4 release already exists; keeping its published APK."
          else
            gh release create owner-android-v1.4 ZENO-Owner-1.4.apk \
              --title "ZENO 보호자용 Android 1.4 (갤럭시 테스트)" \
              --notes "Android 8 이상 갤럭시용 테스트 APK입니다. 1.4는 위치 권한이 켜져 있어도 내 주변 검색이 실패하는 경우를 위해 갤럭시 기본 위치 서비스를 직접 사용합니다. Play 스토어 배포판이 아닙니다. 임시 서명키가 버전마다 달라 기존 1.3 앱에 덮어 설치할 수 없습니다. 기존 앱의 내 아이·추모 기록을 JSON으로 백업하고 다운로드 폴더에서 파일을 확인한 다음 기존 앱 삭제 및 1.4 설치 후 복원하세요."
          fi
