name: Build ZENO Owner Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/owner/**"
      - ".github/workflows/build-android-owner.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeno-owner-android-apk-v1-2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ZENO
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 35 and build tools
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Generate temporary test signing key
        shell: bash
        run: |
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          echo "ZENO_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          echo "ZENO_KEYSTORE=$RUNNER_TEMP/zeno-owner-test.p12" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/zeno-owner-test.p12" \
            -storepass "$PASS" -keypass "$PASS" \
            -alias owner -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=ZENO Owner Test, OU=Development, O=ZENO, C=KR"

      - name: Compile and sign Android APK
        shell: bash
        run: |
          bash android/owner/build.sh "$GITHUB_WORKSPACE/ZENO-Owner-1.2.apk"
          ls -lh ZENO-Owner-1.2.apk
          "$BUILD_TOOLS/aapt" dump badging ZENO-Owner-1.2.apk | head -15

      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZENO-Owner-1.2-Android-APK
          path: ZENO-Owner-1.2.apk
          if-no-files-found: error

      - name: Create public test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view owner-android-v1.2 >/dev/null 2>&1; then
            echo "A v1.2 release already exists; keeping its existing published APK."
          else
            gh release create owner-android-v1.2 ZENO-Owner-1.2.apk \
              --title "ZENO 보호자용 Android 1.2 (갤럭시 테스트)" \
              --notes "Android 8 이상 갤럭시 설치형 테스트 APK. Cloudflare 운영 주소에서 최신 ZENO 보호자 UI를 매 실행 시 로드하도록 WebView 캐시를 끕니다. Play Store 배포본은 아닙니다. 테스트 빌드는 각 버전마다 별도 임시 서명키를 사용하므로 v1.1 위에 업데이트 설치할 수 없습니다. 새 앱을 설치하기 전, 기존 앱에서 복구 코드를 안전하게 보관하세요. 데이터 백업 후 기존 앱 삭제가 필요할 수 있습니다."
          fi
