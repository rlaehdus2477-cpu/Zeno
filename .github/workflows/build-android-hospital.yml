name: Build ZENO Hospital Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/hospital/**"
      - ".github/workflows/build-android-hospital.yml"
  pull_request:
    paths:
      - "android/hospital/**"
      - ".github/workflows/build-android-hospital.yml"
  workflow_dispatch:

concurrency:
  group: zeno-hospital-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out ZENO
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 35 and build tools
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Generate temporary test signing key
        shell: bash
        run: |
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          echo "ZENO_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          echo "ZENO_KEYSTORE=$RUNNER_TEMP/zeno-hospital-test.p12" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/zeno-hospital-test.p12" \
            -storepass "$PASS" -keypass "$PASS" \
            -alias hospital -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=ZENO Hospital Test, OU=Development, O=ZENO, C=KR"

      - name: Compile and sign hospital APK
        shell: bash
        run: |
          bash android/hospital/build.sh "$GITHUB_WORKSPACE/ZENO-Hospital-1.3.apk"
          apk=ZENO-Hospital-1.3.apk
          "$BUILD_TOOLS/aapt" dump badging "$apk" > "$RUNNER_TEMP/hospital-badging.txt"
          grep -F "package: name='kr.zeno.hospital' versionCode='4' versionName='1.3'" "$RUNNER_TEMP/hospital-badging.txt"
          launcher_icon=$(sed -n "s/^application: .*icon='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/hospital-badging.txt")
          test -n "$launcher_icon"
          unzip -p "$apk" "$launcher_icon" | cmp - android/hospital/res/drawable-nodpi/zeno_hospital.webp
          "$BUILD_TOOLS/apksigner" verify --verbose ZENO-Hospital-1.3.apk

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZENO-Hospital-1.3-Android-APK
          path: ZENO-Hospital-1.3.apk
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZENO-Hospital-1.3-Android-APK
      - name: Create public test APK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: rlaehdus2477-cpu/Zeno
        shell: bash
        run: |
          if gh release view hospital-android-v1.3 >/dev/null 2>&1; then
            echo "Release already exists; retain its signing identity and published APK."
          else
            gh release create hospital-android-v1.3 ZENO-Hospital-1.3.apk \
              --title "ZENO 동물병원용 Android 1.3 (갤럭시 테스트)" \
              --notes "보호자용의 강아지·고양이·십자 디자인을 민트색으로 적용한 병원용 테스트 APK입니다. Android 8 이상에서 설치할 수 있습니다. 이전 병원용 테스트 APK와 서명이 달라 교체 시 기존 병원용 앱을 삭제한 뒤 설치하고 다시 로그인해야 합니다."
          fi
