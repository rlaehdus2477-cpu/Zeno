name: Test ZENO booking flow

on:
  pull_request:
    paths:
      - "worker.js"
      - "owner.html"
      - "hospital.html"
      - "schema.sql"
      - "wrangler.toml"
      - "package.json"
      - "tests/booking-flow.mjs"
      - "tests/vetqa-flow.mjs"
      - "tests/pass-flow.mjs"
      - "tests/pass-nutrition-unit.mjs"
      - "tests/inpatient-care-flow.mjs"
      - ".github/workflows/test-booking-flow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  booking-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Booking flow tests (local D1 only)
        run: node tests/booking-flow.mjs
        env:
          NO_PROXY: "127.0.0.1,localhost"
      - name: Vet Q&A flow tests (local D1 only)
        run: node tests/vetqa-flow.mjs
        env:
          NO_PROXY: "127.0.0.1,localhost"
      - name: ZENO PASS flow tests (local D1 only)
        run: node tests/pass-flow.mjs
        env:
          NO_PROXY: "127.0.0.1,localhost"
      - name: Inpatient and night care tests (local D1 only)
        run: node tests/inpatient-care-flow.mjs
        env:
          NO_PROXY: "127.0.0.1,localhost"
      - name: ZENO PASS nutrition calculation tests
        run: node tests/pass-nutrition-unit.mjs
      - name: Symptom hospital finder tests
        run: node tests/symptom-finder-unit.mjs
