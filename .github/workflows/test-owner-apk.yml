name: Test ZENO Owner Android APK

on:
  pull_request:
    paths:
      - "android/owner/**"
      - "owner.html"
      - "tests/test-nearby-location.cjs"
      - "tests/test-ipad-nearby.cjs"
      - "tests/test-galaxy-server-first.cjs"
      - ".github/workflows/test-owner-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nearby location regression test
        run: node tests/test-nearby-location.cjs
      - name: iPad Safari nearby regression test
        run: node tests/test-ipad-nearby.cjs
      - name: Galaxy server-first nearby test
        run: node tests/test-galaxy-server-first.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"
      - name: Compile and verify Galaxy location support
        shell: bash
        run: |
          export ZENO_KEY_PASS="$(openssl rand -hex 24)"
          export ZENO_KEYSTORE="$RUNNER_TEMP/zeno-owner-test.p12"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$ZENO_KEYSTORE" -storepass "$ZENO_KEY_PASS" -keypass "$ZENO_KEY_PASS" \
            -alias owner -keyalg RSA -keysize 3072 -validity 365 \
            -dname "CN=ZENO Owner Test, OU=Development, O=ZENO, C=KR"
          bash android/owner/build.sh "$RUNNER_TEMP/owner-test.apk"
          "$BUILD_TOOLS/aapt" dump badging "$RUNNER_TEMP/owner-test.apk" | head -20
          "$BUILD_TOOLS/aapt" dump permissions "$RUNNER_TEMP/owner-test.apk" | grep -E 'ACCESS_COARSE_LOCATION|ACCESS_FINE_LOCATION'
