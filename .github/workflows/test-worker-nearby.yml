name: Test ZENO nearby coordinate API

on:
  pull_request:
    paths:
      - "worker.js"
      - "owner.html"
      - "tests/test-worker-nearby-coordinates.mjs"
      - ".github/workflows/test-worker-nearby.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Nearby coordinate API regression test (mock D1 + mock NAVER)
        run: node tests/test-worker-nearby-coordinates.mjs
